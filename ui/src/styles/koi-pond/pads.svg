    <!-- Two drops of water on it. -->
    <path d="M232 140a3.4 2.8 0 1 0 0.1 0ZM238 131a1.8 1.5 0 1 0 0.1 0Z" fill="oklch(1 0 0)" fill-opacity="0.75"/>
