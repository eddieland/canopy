            <use href="#outer" transform="rotate(42)"/>
            <use href="#outer" transform="rotate(78)"/>
            <use href="#outer" transform="rotate(114)"/>
            <use href="#outer" transform="rotate(150)"/>
            <use href="#outer" transform="rotate(186)"/>
            <use href="#outer" transform="rotate(222)"/>
            <use href="#outer" transform="rotate(258)"/>
            <use href="#outer" transform="rotate(294)"/>
