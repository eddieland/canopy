            <use href="#tail" fill-opacity="0.7"/>
            <use href="#fins" fill-opacity="0.55"/>
        </g>
        <g fill="oklch(1 0 0)" stroke="oklch(0.845 0.055 238)" stroke-width="0.7" stroke-linejoin="round">
            <use href="#tail" fill-opacity="0.82"/>
            <use href="#fins" fill-opacity="0.74"/>
        </g>
        <path d="M146 49L188 39M146 49L180 45M146 49L176 52M146 49L182 60M146 49L190 70M54 32L69 10M54 32L74 14M54 32L62
                12M54 58L69 80M54 58L74 76M54 58L62 78" stroke="oklch(0.845 0.055 238)" stroke-opacity="0.6"
                stroke-width="0.5"/>
        <use href="#body" fill="url(#back)"/>
        <path d="M19 45C18.8 42.6 21.5 39.6 24 38C26.5 36.4 31 35.1 34 35.5C37 35.9 40.8 38.2 42 40.5C43.2 42.8 42.2
                47.2 41 49.5C39.8 51.8 37.7 54 35 54.5C32.3 55 27.7 54.1 25 52.5C22.3 50.9 19.2 47.4 19 45ZM62 35C63
                32.1 67.3 29.6 71 29C74.7 28.4 80.3 29.8 84 31.5C87.7 33.2 92.2 35.9 93 39C93.8 42.1 91 46.7 89 50C87
                53.3 84.3 57.8 81 59C77.7 60.2 71.7 59.1 69 57C66.3 54.9 66.2 50.2 65 46.5C63.8 42.8 61 37.9 62 35ZM111
                40.5C112.2 38.7 116.8 37.3 120 37.5C123.2 37.8 127.5 40.1 130 42C132.5 43.9 135.2 46.8 135 49C134.8 51.3
                131.8 54.6 129 55.5C126.2 56.4 120.7 55.7 118 54.5C115.3 53.3 114.2 50.8 113 48.5C111.8 46.2 109.8 42.3
                111 40.5Z" fill="url(#gilt)" clip-path="url(#skin)"/>
        <use href="#body" fill="none" stroke="oklch(0.845 0.055 238)" stroke-width="0.8"/>
        <path d="M67 45C67 44.3 74.5 43.2 80 42.9C85.5 42.6 93.3 42.8 100 43.2C106.7 43.6 116.5 44.9 120 45.5C123.5 46.1
                124.3 46.4 121 46.7C117.7 47 106.8 47.1 100 47.2C93.2 47.3 85.5 47.5 80 47.1C74.5 46.7 67 45.7 67 45Z"
                fill="oklch(0.86 0.03 236)" fill-opacity="0.75"/>
        <path d="M27 35.7h0M27 54.3h0" stroke="oklch(0.845 0.055 238)" stroke-width="3" stroke-linecap="round"/>
    </g>
    <!-- The pads, veined, a little light along the edge that faces the sun. -->
    <g fill="url(#leaf)" stroke="oklch(0.85 0.06 142)" stroke-width="0.8" stroke-linejoin="round">
        <path d="M202.3 107.3L181.8 68.3A50 50 0 1 1 169.4 77.9Z"/>
        <path d="M118.9 131.8L144 112.3A36 36 0 1 1 135.6 104.8Z"/>
        <path d="M245.5 42.9L230.8 61.6A27 27 0 1 1 238.2 65.5Z"/>
        <path d="M177.6 31.6L188.2 37.8A14 14 0 1 1 189.7 33.7Z"/>
    </g>
    <path d="M205 105.1L199.6 66.4M208.6 105.5L223.2 69.3M211.5 107.7L242.2 83.7M212.9 111L251.6 105.6M212.5 114.6L248.7
            129.2M210.3 117.5L234.3 148.2M207 118.9L212.4 157.6M203.4 118.5L188.8 154.7M200.5 116.3L169.8 140.3M199.1
            113L160.4 118.4M199.5 109.4L163.3 94.8M120.8 133.4L147.5 124.8M120.9 136L148.4 141.9M119.7 138.4L140.6
            157.2M117.6 139.8L126.2 166.5M115 139.9L109.1 167.4M112.6 138.7L93.8 159.6M111.2 136.6L84.5 145.2M111.1
            134L83.6 128.1M112.3 131.6L91.4 112.8M114.4 130.2L105.8 103.5M117 130.1L122.9 102.6M243.8 42L225.9
            53.2M243.2 40.1L222.2 40.9M243.7 38.2L225.1 28.3M245 36.8L233.8 18.9M246.9 36.2L246.1 15.2M248.8 36.7L258.7
            18.1M250.2 38L268.1 26.8M250.8 39.9L271.8 39.1M250.3 41.8L268.9 51.7M249 43.2L260.2 61.1M247.1 43.8L247.9
            64.8M177.3 32.5L184.3 40.9M176.3 32.9L178.2 43.7M175.3 32.8L171.6 43.1M174.5 32.3L166.1 39.3M174.1
            31.3L163.3 33.2M174.2 30.3L163.9 26.6M174.7 29.5L167.7 21.1M175.7 29.1L173.8 18.3M176.7 29.2L180.4
            18.9M177.5 29.7L185.9 22.7M177.9 30.7L188.7 28.8" stroke="oklch(1 0 0)" stroke-opacity="0.5"
            stroke-width="0.7" stroke-linecap="round"/>
    <path d="M158.9 124.6A48.8 48.8 0 0 1 218.6 64.9M82.4 144A34.8 34.8 0 0 1 125 101.4M222.1 46.7A25.8 25.8 0 0 1 253.7
            15.1M163.6 34.3A12.8 12.8 0 0 1 179.3 18.6" fill="none" stroke="oklch(1 0 0)" stroke-opacity="0.6"
            stroke-width="1.1" stroke-linecap="round"/>
    <!-- The lily, open on the largest pad: three whorls of petals about a gold heart. -->
    <circle cx="182" cy="96" r="23.2" filter="url(#soft)" fill="oklch(0.85 0.06 142)"/>
    <g transform="translate(177 88)" stroke="oklch(0.845 0.055 238)" stroke-width="0.55">
