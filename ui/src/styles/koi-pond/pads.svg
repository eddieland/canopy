            <stop offset="0.15" stop-color="oklch(1 0 0)"/>
            <stop offset="1" stop-color="oklch(0.87 0.075 296)"/>
        </linearGradient>
        <linearGradient id="inner-fill">
            <stop offset="0.2" stop-color="oklch(1 0 0)"/>
            <stop offset="1" stop-color="oklch(0.93 0.045 296)"/>
        </linearGradient>
        <linearGradient id="heart-fill">
            <stop offset="0" stop-color="oklch(0.96 0.06 96)"/>
            <stop offset="1" stop-color="oklch(1 0 0)"/>
        </linearGradient>
    </defs>
    <!-- A petal adrift, in the still rings it made where it landed. -->
    <g transform="translate(52 34)" fill="none" stroke="oklch(1 0 0)" stroke-width="1.1">
        <circle r="9" stroke-opacity="0.8"/>
        <circle r="17" stroke-opacity="0.6"/>
        <circle r="26" stroke-opacity="0.35"/>
        <use href="#inner" transform="rotate(28) scale(0.62)" fill="url(#inner-fill)" stroke="oklch(0.845 0.055 238)"
                stroke-width="0.8"/>
    </g>
    <!-- The shadows of the pads on the floor, down and to the right of each, as the sun throws the panels' own. -->
    <g filter="url(#floor)" fill="oklch(0.845 0.055 238)">
