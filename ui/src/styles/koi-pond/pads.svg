<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 196">
    <!--
        The corner of the pond: lily pads, an open lily, a petal where it landed, and the koi that lives under
        them, each over its shadow on the floor. One of the two drawings that hold colors of their own, since one
        mask cannot paint several (src/styles/tokens.css): the pads a pale sage, the gold a pale straw, so no
        slice of either between two panels passes for a running or a blocked run. A page may set text across
        it, so no paint here is deeper than text reads on at 4.5:1 (tokens.test.ts): each shadow and line is a
        light shade that holds it at full strength, never a deep one thinned, so two that cross go no deeper.
    -->
    <defs>
        <path id="body" d="M15 45C15 43.2 16.5 41.4 18.5 39.6C20.5 37.8 23.4 35.8 27 34.4C30.6 33 35.5 31.9 40 31.2C44.5
                30.5 49 30.1 54 30C59 29.9 64.3 30.1 70 30.5C75.7 30.9 82 31.6 88 32.4C94 33.2 100 34.2 106 35.4C112
                36.5 118.7 38 124 39.2C129.3 40.5 134 41.8 138 42.8C142 43.7 146.3 43.5 148 45.2C149.7 46.8 149.7 51.5
                148 52.8C146.3 54 142 52.6 138 52.8C134 52.9 129.3 53.2 124 53.6C118.7 54.1 112 54.7 106 55.4C100 56 94
                56.9 88 57.6C82 58.3 75.7 59.1 70 59.5C64.3 59.9 59 60.1 54 60C49 59.9 44.5 59.5 40 58.8C35.5 58.1 30.6
                57 27 55.6C23.4 54.2 20.5 52.2 18.5 50.4C16.5 48.6 15 46.8 15 45Z"/>
        <path id="tail" d="M143 44.9C145.8 43.1 154.2 42.7 160 41C165.8 39.3 172.8 35.7 178 35C183.2 34.3 190.2 35 191
                37C191.8 39 186 44 183 47C180 50 172.7 52.3 173 55C173.3 57.7 181.5 59.9 185 63C188.5 66.1 195 72.2 194
                73.5C193 74.8 184.8 73 179 71C173.2 69 165 64.7 159 61.5C153 58.3 145.7 54.5 143 51.7C140.3 49 140.2
                46.7 143 44.9Z"/>
        <path id="fins" d="M43 33C40.7 31.4 46.3 25.7 49 22C51.7 18.3 55.5 13.4 59 11C62.5 8.6 67 7.3 70 7.5C73 7.7 76.3
                9.6 77 12C77.7 14.4 76.3 18.8 74 22C71.7 25.3 68.2 29.7 63 31.5C57.8 33.3 45.3 34.6 43 33ZM43 57C40.7
                58.6 46.3 64.3 49 68C51.7 71.7 55.5 76.6 59 79C62.5 81.4 67 82.7 70 82.5C73 82.3 76.3 80.4 77 78C77.7
                75.6 76.3 71.3 74 68C71.7 64.8 68.2 60.3 63 58.5C57.8 56.7 45.3 55.4 43 57ZM95 34.6C94 33.2 99.6 29.1
                102 27.5C104.4 25.9 107.6 24.6 109.5 24.8C111.4 25 113.8 26.7 113.5 28.5C113.3 30.3 111.1 34.8 108
                35.8C104.9 36.8 96 36 95 34.6ZM95 56C94 57.4 99.6 61.5 102 63.1C104.4 64.7 107.6 66 109.5 65.8C111.4
                65.6 113.8 63.9 113.5 62.1C113.3 60.3 111.1 55.8 108 54.8C104.9 53.8 96 54.6 95 56Z"/>
        <clipPath id="skin">
            <use href="#body"/>
        </clipPath>
        <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="oklch(0.86 0.03 236)"/>
            <stop offset="0.35" stop-color="oklch(1 0 0)"/>
            <stop offset="0.65" stop-color="oklch(1 0 0)"/>
            <stop offset="1" stop-color="oklch(0.86 0.03 236)"/>
        </linearGradient>
        <linearGradient id="gilt" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="oklch(0.85 0.1 88)"/>
            <stop offset="0.35" stop-color="oklch(0.91 0.095 96)"/>
            <stop offset="0.65" stop-color="oklch(0.91 0.095 96)"/>
            <stop offset="1" stop-color="oklch(0.85 0.1 88)"/>
        </linearGradient>
        <filter id="soft" x="-12%" y="-24%" width="124%" height="148%">
            <feGaussianBlur stdDeviation="2.6"/>
        </filter>
        <filter id="floor" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3.2"/>
        </filter>
        <radialGradient id="leaf" cx="0.32" cy="0.28" r="0.8">
            <stop offset="0" stop-color="oklch(0.925 0.045 126)"/>
            <stop offset="1" stop-color="oklch(0.86 0.06 140)"/>
        </radialGradient>
        <path id="outer" d="M0 0C8.1 -5.4 21.1 -3.3 27 0C21.1 3.3 8.1 5.4 0 0Z"/>
