    <!--
        The nets of sunlight on the floor of the pond, as ripples on its surface focus the sun: the light left
        between rounded cells, thin where two lie side by side and wide where three meet, and brightest in the
        pools where the swell gathers it. A mask, so it holds no color: its layer paints it
        (src/styles/tokens.css). A tile whose cells and pools close across its edges, so it repeats without a
        seam.
    -->
