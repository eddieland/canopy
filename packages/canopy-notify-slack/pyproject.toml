[project]
name = "canopy-notify-slack"
# From the latest v* tag, as canopy's is (D085), so every package canopy ships carries its version.
dynamic = ["version"]
description = "canopy's Slack notification sink: posts each message it reads on stdin to a Slack incoming webhook."
license = "MIT"
authors = [{ name = "eddieland" }]
keywords = ["canopy", "notifications", "slack", "webhook"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.12"
# click for its command line (D025), and nothing from canopy: it runs as its own process, as a sink command
# (DESIGN §20, D041).
dependencies = ["click>=8.5.0"]

[project.scripts]
canopy-notify-slack = "canopy_notify_slack:main"

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Repository = "https://github.com/eddieland/canopy/tree/main/packages/canopy-notify-slack"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# The same scheme as canopy's, in the root pyproject.toml.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

# The version is built from git, so a new commit or tag rebuilds the metadata, not only a changed pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_notify_slack"]
