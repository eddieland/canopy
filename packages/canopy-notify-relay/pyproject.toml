[project]
name = "canopy-notify-relay"
version = "0.0.1"
description = "Shows canopy's notifications on another machine: collects a mailbox sink's messages over SSH or HTTP."
license = "LicenseRef-Proprietary"
classifiers = ["Private :: Do Not Upload"]
requires-python = ">=3.12"
# Stdlib only, and nothing from canopy: it runs on the operator's other machine and opens connections (DESIGN §20).
dependencies = []

[project.scripts]
canopy-notify-relay = "canopy_notify_relay:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_notify_relay"]
