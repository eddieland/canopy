[project]
name = "canopy-codemods"
# From the latest v* tag, as canopy's is (D085), so every package in the workspace carries its version.
dynamic = ["version"]
description = "The codemods canopy's own code is held to: mechanical rewrites applied by `make fmt`, checked by lint."
readme = "README.md"
license = "MIT"
authors = [{ name = "eddieland" }]
keywords = ["canopy", "codemod", "libcst"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.12"
# click for its command line (D025) and libcst to rewrite a module and keep every comment and blank line it does not
# touch, which the stdlib's ast cannot. Nothing from canopy: it is a dev tool canopy neither ships nor runs.
dependencies = [
    "click>=8.5.1",
    "libcst>=1.9.0",
]

[project.scripts]
canopy-codemods = "canopy_codemods:main"

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Repository = "https://github.com/eddieland/canopy/tree/main/packages/canopy-codemods"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# The same scheme as canopy's, in the root pyproject.toml.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

# The version is built from git, so a new commit or tag rebuilds the metadata, not only a changed pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_codemods"]
