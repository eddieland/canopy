[project]
name = "canopy-github"
version = "0.0.1"
description = "canopy's GitHub programs: read a PR's reviews and threads, and post the replies the operator approved."
license = "MIT"
authors = [{ name = "eddieland" }]
keywords = ["canopy", "github", "graphql", "review"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
requires-python = ">=3.12"
# Stdlib only, and nothing from canopy: canopy runs these as commands, so the harness never holds a token or opens a
# connection (D041, DESIGN §29).
dependencies = []

[project.scripts]
canopy-connect-github = "canopy_github.connect:main"
canopy-post-github = "canopy_github.post:main"

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Repository = "https://github.com/eddieland/canopy/tree/main/packages/canopy-github"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_github"]
