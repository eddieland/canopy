[project]
name = "canopy-http"
# From the latest v* tag, as canopy's is (D085), so every package canopy ships carries its version.
dynamic = ["version"]
description = "canopy's HTTP client for the programs it ships: one origin, no redirects, and retries only where safe."
license = "MIT"
authors = [{ name = "eddieland" }]
keywords = ["canopy", "http", "client"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.12"
# httpx2 for its transport: it tells a request that never left from one that may have been carried out, and trusts
# the system's certificates (truststore), so an Enterprise host's own CA works. Nothing from canopy.
dependencies = ["httpx2>=2.13.1"]

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Repository = "https://github.com/eddieland/canopy/tree/main/packages/canopy-http"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# The same scheme as canopy's, in the root pyproject.toml.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

# The version is built from git, so a new commit or tag rebuilds the metadata, not only a changed pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_http"]
