[project]
name = "canopy-artifacts"
# From the latest v* tag, as canopy's is (D085), so every package canopy ships carries its version.
dynamic = ["version"]
description = "canopy's local artifact store: pages workers publish and the comments on them, served over MCP on stdio."
readme = "README.md"
license = "MIT"
authors = [{ name = "eddieland" }]
keywords = ["artifacts", "canopy", "comments", "mcp"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
requires-python = ">=3.12"
# click for its command line (D025), pydantic for its tools' arguments (D026), canopy-mcp for the protocol (D124), and
# nothing from canopy: canopy names it in its runtime's MCP config and never imports it, so what workers publish stays
# out of the journal (D041, §38).
dependencies = ["canopy-mcp", "click>=8.5.0", "pydantic>=2.14.1"]

[project.scripts]
canopy-artifacts = "canopy_artifacts.cli:main"

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Repository = "https://github.com/eddieland/canopy/tree/main/packages/canopy-artifacts"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# The same scheme as canopy's, in the root pyproject.toml.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

# The version is built from git, so a new commit or tag rebuilds the metadata, not only a changed pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.hatch.build.targets.wheel]
packages = ["src/canopy_artifacts"]
