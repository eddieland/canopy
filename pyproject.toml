[project]
name = "canopy"
# From the latest v* tag (D085): a tag is the only place a release's version is written.
dynamic = ["version"]
description = "Unattended, local agent loop driven by your issue tracker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eddieland" }]
keywords = ["agents", "automation", "ci", "code-review", "issue-tracker", "jira", "llm", "worktree"]
# The license is the `license` expression above, so no `License ::` classifier (PEP 639). Python versions are the ones
# CI runs on.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload, where `canopy` is another project's name (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "canopy-notify-slack",
    "canopy-sandbox",
    "click>=8.5.0",
    "fastapi>=0.143.0",
    "pydantic>=2.14.0",
    "rich>=15.0.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
canopy = "canopy.cli.main:main"
# Notification sinks canopy ships (DESIGN §20). They run as sink commands, never inside the harness.
canopy-notify-desktop = "canopy.notify.desktop:main"
# Its own distribution, a workspace member (D041); listed so the install that puts canopy on PATH puts it there too.
canopy-notify-slack = "canopy_notify_slack:main"
# The sandbox wrapper, a workspace member too: the prefix on a sandboxed run's command template (DESIGN §24).
canopy-sandbox = "canopy_sandbox:main"

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Documentation = "https://github.com/eddieland/canopy/tree/main/docs"
Repository = "https://github.com/eddieland/canopy"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# 0.2.0 on the commit tagged v0.2.0; 0.2.1.dev3+1a2b3c4 three commits after it. A checkout with no tags in it (a
# shallow clone) counts from 0.0.0, and one with no git at all builds as the fallback.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

# Files canopy reads at run time, bundled into the wheel. canopy.infra.resources finds them here in an installed copy
# and at the repository root in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "canopy/_data/migrations"
".agents/prompts" = "canopy/_data/prompts"
".agents/agents" = "canopy/_data/agents"
".agents/skills" = "canopy/_data/skills"
".agents/operator-skill" = "canopy/_data/operator-skill"

# The built web UI goes in as canopy/_data/ui, built with npm first when it is on PATH (D079).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# ui/ ships as source; its dependencies and build output are not part of it.
[tool.hatch.build.targets.sdist]
exclude = ["ui/node_modules", "ui/dist", "ui/test-results", "ui/playwright-report"]

# The repository is a uv workspace: canopy at the root, separate programs it ships under packages/ (D041).
[tool.uv.workspace]
members = ["packages/*"]

# The version is built from git, so a new commit or tag rebuilds canopy's metadata, not only a changed pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
canopy-notify-slack = { workspace = true }
canopy-sandbox = { workspace = true }

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    "editorconfig-checker>=3.11.1",
    "httpx2>=2.13.1",
    "hypothesis>=6.168.5",
    "pyrefly>=1.3.2",
    "pytest>=9.1",
    # Line and branch coverage for `make coverage`, which CI uploads to Codecov.
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.10",
    "rumdl>=0.2.78",
    "shellcheck-py>=0.11.0.1",
    # Snapshot tests: what canopy renders whole, held to a file under a test's `__snapshots__/` (AGENTS.md, Testing).
    "syrupy>=6.1.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# The fakes are extensionless executables; lint and format them as Python too.
extend-include = ["tests/fakes/agent", "tests/fakes/srt", "tests/fakes/treehouse"]

[tool.ruff.lint]
# Every stable rule (D018). Opt out below with a reason, never by narrowing `select`. Preview rules stay off, except
# the pydoclint ones named in `extend-select`: they change between ruff releases, so selecting `ALL` of them would
# make a lockfile bump a lint-policy change.
select = ["ALL"]
# A public function's Google docstring sections must match its body (D018): a Returns section when it returns a
# value, Yields when it yields, Raises for each exception it raises itself, and none it does not have. These rules
# are preview-only, so `preview` is on and `explicit-preview-rules` keeps every other preview rule off. DOC502 (a
# documented exception the body does not raise) is not here: a Raises section rightly names what a callee raises.
preview = true
explicit-preview-rules = true
extend-select = ["DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501"]
ignore = [
    "COM812",  # Conflicts with `ruff format`, which owns trailing commas.
    "CPY001",  # No per-file copyright headers.
    "EM101",   # Building the message in a variable first only moves the string; tracebacks are readable as is.
    "EM102",   # Same as EM101, for f-strings.
    "PLR0913", # Keyword-only arguments are how we spell options (procs.Runner.run); the count is not the problem.
    "TC003",   # Stdlib imports cost nothing at runtime; TYPE_CHECKING blocks for them are noise.
    "TRY003",  # A specific message on a small exception hierarchy beats one exception class per message.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# canopy.infra.procs is the only module that runs subprocesses (AGENTS.md, DESIGN §5).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run external processes through canopy.infra.procs."
"os.system".msg = "Run external processes through canopy.infra.procs."
"os.popen".msg = "Run external processes through canopy.infra.procs."
# The harness makes no network call except through configured commands (TRUST_MODEL T2, DESIGN §20).
"urllib.request".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"http.client".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"socket".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
# Tests patch with unittest.mock, as context managers (AGENTS.md, Testing).
"pytest.MonkeyPatch".msg = "Patch with `mock.patch`, `mock.patch.object`, or `mock.patch.dict` in a `with` block."

# `from unittest import mock`, then `mock.patch`, `mock.create_autospec` (AGENTS.md, Testing).
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["unittest.mock"]

[tool.ruff.lint.per-file-ignores]
# The subprocess boundary (D015). Arguments are an argv list, never a shell string.
"src/canopy/infra/procs.py" = ["TID251", "S603"]
"tests/**" = [
    "ARG001",  # Fixtures requested only for their side effects (fakes on PATH, state files set).
    "D",       # Docstrings are optional in tests and unchecked when present; test names are the documentation.
    "DOC",     # Same as D: a test's docstring, when it has one, needs no sections.
    "PLR0917", # pytest passes fixtures as positional arguments; a test's signature is its fixture list.
    "PLR2004", # Expected exit codes and counts are clearer inline than as named constants.
    "S101",    # pytest asserts.
]
# A click command's docstring is its --help text, so Returns and Raises sections would print there. Every command
# returns an exit code and raises CliError for main to report; that is main's contract, not each command's.
"src/canopy/cli/*" = ["DOC201", "DOC501"]
# The fakes are standalone scripts that talk on stdout and stderr.
"tests/fakes/*" = ["T201"]
# The sandbox wrapper is a separate program, not canopy (DESIGN §24): it runs git and srt, and reports on
# stderr.
"packages/canopy-sandbox/**" = ["T201", "TID251"]
# The wheel's build hook runs npm (D079); it is part of packaging, not of canopy.
"hatch_build.py" = ["S603", "TID251"]
# The Slack sink is a separate program whose job is the network call the harness never makes (DESIGN §20).
"packages/canopy-notify-slack/**" = ["TID251"]
# FastAPI reads a route's annotations at runtime to validate and to build the schema, so its models and dependencies
# are imported for real (TC001). A route's docstring is its description in the schema, and the errors it answers are
# its decorator's `responses`, so Returns, Yields, and Raises sections would only repeat them there.
"src/canopy/serve/api/*" = ["DOC201", "DOC402", "DOC501", "TC001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With -n, an idle xdist worker takes queued tests from a busy one, so a few slow tests do not leave the others waiting
# at the end. A run without -n stays serial.
addopts = ["--dist", "worksteal"]
# Every strictness option pytest has, and any it adds. A warning fails the test that raised it, so a deprecation is
# fixed when it appears instead of when the dependency removes the API.
strict = true
# Later entries win.
filterwarnings = [
    "error",
    # procs.spawn detaches its child on purpose, so Popen warns that it is still running.
    "ignore:subprocess \\d+ is still running:ResourceWarning",
]

# What `make coverage` measures: canopy and its workspace members, not the tests or the fakes.
[tool.coverage.run]
branch = true
source_pkgs = ["canopy", "canopy_notify_slack", "canopy_sandbox"]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "assert_never\\("]

# Strict preset (D017). The fakes are extensionless, so list them explicitly.
[tool.pyrefly]
preset = "strict"
project-includes = [
    "src",
    "packages",
    "tests",
    "tests/fakes/agent",
    "tests/fakes/srt",
    "tests/fakes/treehouse",
]
# Tests are packages under the repository root (D019) and import shared helpers from `tests.conftest`.
search-path = ["src", "packages/canopy-notify-slack/src", "packages/canopy-sandbox/src", "."]

# Markdown: every default rule. Tables and code blocks may run past the line length: neither can be wrapped.
[tool.rumdl]
line-length = 120
# Agent definitions open with front matter and CLAUDE.md with an include, not a heading.
disable = ["MD041"]
# Generated design explorations, kept as they were rendered, and test snapshots, compared byte for byte.
exclude = ["docs/ui-explorations", "**/__snapshots__"]

[tool.rumdl.MD013]
tables = false
code-blocks = false

[tool.rumdl.per-file-ignores]
# A worker's last line of output is one JSON object, so the prompt shows it on one line.
".agents/prompts/worker-*.md" = ["MD013"]
