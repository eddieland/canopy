[project]
name = "canopy"
version = "0.0.1"
description = "Unattended, local agent loop driven by your issue tracker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
canopy = "canopy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

# Files canopy reads at run time, bundled into the wheel. canopy.resources finds them here in an installed copy and at
# the repository root in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "canopy/_data/migrations"
".agents/prompts" = "canopy/_data/prompts"
".agents/agents" = "canopy/_data/agents"
".agents/skills" = "canopy/_data/skills"

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=8",
    "ruff>=0.16",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# The fakes are extensionless executables; lint and format them as Python too.
extend-include = ["tests/fakes/agent", "tests/fakes/treehouse"]

[tool.ruff.lint]
# Every stable rule (D018). Opt out below with a reason, never by narrowing `select`. Preview rules stay off: they
# change between ruff releases, so enabling them would make a lockfile bump a lint-policy change.
select = ["ALL"]
ignore = [
    "COM812",  # Conflicts with `ruff format`, which owns trailing commas.
    "CPY001",  # No per-file copyright headers.
    "EM101",   # Building the message in a variable first only moves the string; tracebacks are readable as is.
    "EM102",   # Same as EM101, for f-strings.
    "PLR0913", # Keyword-only arguments are how we spell options (procs.Runner.run); the count is not the problem.
    "TC003",   # Stdlib imports cost nothing at runtime; TYPE_CHECKING blocks for them are noise.
    "TRY003",  # A specific message on a small exception hierarchy beats one exception class per message.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# procs.py is the only module that runs subprocesses (AGENTS.md, DESIGN.md §5).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run external processes through canopy.procs."
"os.system".msg = "Run external processes through canopy.procs."
"os.popen".msg = "Run external processes through canopy.procs."

[tool.ruff.lint.per-file-ignores]
# The subprocess boundary (D015). Arguments are an argv list, never a shell string.
"src/canopy/procs.py" = ["TID251", "S603"]
"tests/**" = [
    "ARG001",  # Fixtures requested only for their side effects (fakes on PATH, state files set).
    "D",       # Docstrings are optional in tests and unchecked when present; test names are the documentation.
    "PLR2004", # Expected exit codes and counts are clearer inline than as named constants.
    "S101",    # pytest asserts.
]
# The fakes are standalone scripts that talk on stdout and stderr.
"tests/fakes/*" = ["T201"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Strict preset (D017). The fakes are extensionless, so list them explicitly.
[tool.pyrefly]
preset = "strict"
project-includes = ["src", "tests", "tests/fakes/agent", "tests/fakes/treehouse"]
# Tests are packages under the repository root (D019) and import shared helpers from `tests.conftest`.
search-path = ["src", "."]
