[project]
name = "canopy"
version = "0.0.1"
description = "Unattended, local agent loop driven by your issue tracker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
canopy = "canopy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

[dependency-groups]
dev = [
    "pyrefly>=1.3.1",
    "pytest>=8",
    "ruff>=0.6",
    "ty",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]
ignore = ["PLR0913"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyrefly]
project-includes = ["src", "tests"]
