[project]
name = "canopy"
# From the latest v* tag (D085): a tag is the only place a release's version is written.
dynamic = ["version"]
description = "Unattended, local agent loop driven by your issue tracker."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "eddieland" }]
keywords = ["agents", "automation", "ci", "code-review", "issue-tracker", "jira", "llm", "worktree"]
# The license is the `license` expression above, so no `License ::` classifier (PEP 639). Python versions are the ones
# CI runs on.
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    # Makes PyPI refuse an upload, where `canopy` is another project's name (D046).
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Software Development :: Bug Tracking",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.15.1",
    "canopy-artifacts",
    "canopy-github",
    "canopy-jira",
    "canopy-mcp",
    "canopy-notify-slack",
    "canopy-sandbox",
    "click>=8.5.0",
    "fastapi>=0.161.1",
    "opentelemetry-api>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "pydantic>=2.14.1",
    "rich>=15.0.0",
    # FastAPI's own foundation; canopy.serve's middleware and responses import it directly, so it is declared too.
    "starlette>=1.9.0",
    "tomlkit>=0.15.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
canopy = "canopy.cli.launcher:main"
# Notification sinks canopy ships (DESIGN §20). They run as sink commands, never inside the harness.
canopy-notify-desktop = "canopy.notify.desktop:main"
# Its own distribution, a workspace member (D041); listed so the install that puts canopy on PATH puts it there too.
canopy-notify-slack = "canopy_notify_slack:main"
# Its reader of the replies in the sink's ticket threads, a connector's command (ROADMAP M64).
canopy-connect-slack = "canopy_notify_slack.connect:main"
# canopy's GitHub reader and poster, a workspace member too: commands, so the harness holds no token (DESIGN §29).
canopy-connect-github = "canopy_github.connect:main"
canopy-post-github = "canopy_github.post:main"
# canopy's Jira connector, a workspace member too: a `tracker` source's command, with credentials of its own (§30).
canopy-connect-jira = "canopy_jira.connect:main"
# The sandbox wrapper, a workspace member too: the prefix on a sandboxed run's command template (DESIGN §24).
canopy-sandbox = "canopy_sandbox:main"
# The local artifact store, a workspace member too: an MCP server the runtime's config names (DESIGN §38).
canopy-artifacts = "canopy_artifacts.cli:main"

[project.urls]
Homepage = "https://github.com/eddieland/canopy"
Documentation = "https://github.com/eddieland/canopy/tree/main/docs"
Repository = "https://github.com/eddieland/canopy"
Issues = "https://github.com/eddieland/canopy/issues"

[build-system]
requires = ["hatchling", "uv-dynamic-versioning==0.14.1"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

# 0.2.0 on the commit tagged v0.2.0; 0.2.1.dev3+1a2b3c4 three commits after it. A checkout with no tags in it (a
# shallow clone) counts from 0.0.0, and one with no git at all builds as the fallback.
[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["src/canopy"]

# Files canopy reads at run time, bundled into the wheel. canopy.infra.resources finds them here in an installed copy
# and at the repository root in a source checkout.
[tool.hatch.build.targets.wheel.force-include]
"migrations" = "canopy/_data/migrations"
".agents/prompts" = "canopy/_data/prompts"
".agents/personas" = "canopy/_data/personas"
".agents/agents" = "canopy/_data/agents"
".agents/skills" = "canopy/_data/skills"
".agents/plugins" = "canopy/_data/plugins"
".agents/operator-skill" = "canopy/_data/operator-skill"
"examples/chores" = "canopy/_data/chores"

# The built web UI goes in as canopy/_data/ui, built with npm first when it is on PATH (D079).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# ui/ ships as source; its dependencies and build output are not part of it.
[tool.hatch.build.targets.sdist]
exclude = ["ui/node_modules", "ui/dist", "ui/test-results", "ui/playwright-report"]

# The public demo over mock data (D122): Vercel installs canopy from uv.lock, whose wheel bundles the UI, and serves
# this app. vercel.json sets the framework and turns deployments off, of main too, so pull requests get no Vercel
# check; set `git.deploymentEnabled` to `{"**": false, "main": true}` to deploy main again. vercel-ignore.sh skips a
# build when nothing the demo serves changed since the last deploy.
[tool.vercel]
entrypoint = "vercel_app:app"

# The repository is a uv workspace: canopy at the root, separate programs it ships under packages/ (D041).
[tool.uv.workspace]
members = ["packages/*"]

# The version is built from git, so a new commit or tag rebuilds canopy's metadata, not only a changed pyproject.toml.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
canopy-artifacts = { workspace = true }
canopy-github = { workspace = true }
canopy-http = { workspace = true }
canopy-jira = { workspace = true }
canopy-mcp = { workspace = true }
canopy-notify-slack = { workspace = true }
canopy-review-bench = { workspace = true }
canopy-sandbox = { workspace = true }

[dependency-groups]
dev = [
    "actionlint-py>=1.7.12.25",
    # A program of its own that scores another code review bot on blind PRs (packages/canopy-review-bench); canopy
    # never runs it, so it is here for its tests and type checks, not among canopy's dependencies.
    "canopy-review-bench",
    "editorconfig-checker>=3.11.1",
    "httpx2>=2.16.0",
    "hypothesis>=6.170.8",
    # Holds what an MCP tool returns to the schema it lists, as a client would check it (tests/canopy/loop/test_mcp.py).
    "jsonschema>=4.26.0",
    # Git hooks (prek.toml) that run the formatters and linters on a commit: `make hooks` installs them.
    "prek>=0.5.7",
    "pyrefly>=1.4.0",
    "pytest>=9.1",
    # Line and branch coverage: `make coverage`, and `make check COVERAGE=1`, whose coverage.xml CI sends to Codecov.
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.2",
    "rumdl>=0.3.0",
    "shellcheck-py>=0.11.0.1",
    # Snapshot tests: what canopy renders whole, held to a file under a test's `__snapshots__/` (AGENTS.md, Testing).
    "syrupy>=6.1.1",
    # Security lint for the GitHub workflows, beside actionlint's correctness checks: pins, triggers, token handling.
    # jsonschema's types, for the type checker.
    "types-jsonschema>=4.26.0.20261006",
    "zizmor>=1.31.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"
# The fakes are extensionless executables; lint and format them as Python too.
extend-include = ["tests/fakes/agent", "tests/fakes/github", "tests/fakes/srt", "tests/fakes/treehouse"]

[tool.ruff.lint]
# Every stable rule (D018). Opt out below with a reason, never by narrowing `select`. Preview rules stay off, except
# the pydoclint ones named in `extend-select`: they change between ruff releases, so selecting `ALL` of them would
# make a lockfile bump a lint-policy change.
select = ["ALL"]
# A public function's Google docstring sections must match its body (D018): a Returns section when it returns a
# value, Yields when it yields, Raises for each exception it raises itself, and none it does not have. These rules
# are preview-only, so `preview` is on and `explicit-preview-rules` keeps every other preview rule off. DOC502 (a
# documented exception the body does not raise) is not here: a Raises section rightly names what a callee raises.
# The other preview rules here were chosen one by one; a preview rule not named stays off.
preview = true
explicit-preview-rules = true
extend-select = [
    # Docstring sections (D018).
    "DOC102", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "D420",
    # Likely bugs.
    "B901", "B909", "PLE1141", "PLE4703", "PLW0244", "RUF045", "RUF056", "RUF065", "RUF066", "RUF071", "RUF072",
    "RUF074", "RUF077",
    # Complexity, beside the stable PLR09xx limits.
    "PLR0904", "PLR0916", "PLR1702",
    # Simpler spellings.
    "B903", "FURB101", "FURB103", "FURB113", "FURB118", "FURB140", "FURB142", "FURB145", "FURB148", "FURB189",
    "PLC2701", "PLC2801", "PLR6104", "PT029", "RUF031", "RUF038", "RUF039", "RUF047", "RUF050", "RUF052", "RUF055",
    "RUF070", "TC008", "UP048", "UP051",
    # Pickle and the stdlib XML parsers, unsafe on untrusted input; canopy reads other programs' output (TRUST_MODEL).
    "S403", "S405", "S406", "S407", "S408", "S409", "S411",
]
# COM812 (a trailing comma on every multi-line call, literal, and signature) stays on, though `ruff format` warns that
# it may conflict: `make fmt` adds the commas before formatting, and the formatter then keeps one item per line.
ignore = [
    "CPY001",  # No per-file copyright headers.
    "EM101",   # Building the message in a variable first only moves the string; tracebacks are readable as is.
    "EM102",   # Same as EM101, for f-strings.
    "PLR0913", # Keyword-only arguments are how we spell options (procs.Runner.run); the count is not the problem.
    "TC003",   # Stdlib imports cost nothing at runtime; TYPE_CHECKING blocks for them are noise.
    "TRY003",  # A specific message on a small exception hierarchy beats one exception class per message.
]

[tool.ruff.lint.pydocstyle]
convention = "google"

# pydantic resolves a model's annotations when its class is made, and `records` a row type's or a view's when it reads
# one, so what they name is imported for real (TC001): the API's models in serve are built on schema.Model, and each
# feature's module in schema/ imports the shared ones.
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "canopy.serve.schema.Model",
  "canopy.core.orm.Row",
  "canopy.core.orm.View",
  "canopy.core.records.Row",
  "canopy.core.records.View",
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# canopy.infra.procs is the only module that runs subprocesses (AGENTS.md, DESIGN §5).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"subprocess".msg = "Run external processes through canopy.infra.procs."
"os.system".msg = "Run external processes through canopy.infra.procs."
"os.popen".msg = "Run external processes through canopy.infra.procs."
"asyncio.create_subprocess_exec".msg = "Run external processes through canopy.infra.procs."
"asyncio.create_subprocess_shell".msg = "Run external processes through canopy.infra.procs."
# The harness makes no network call except through configured commands (TRUST_MODEL T2, DESIGN §20).
"asyncio.open_connection".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"asyncio.open_unix_connection".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"ftplib".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"smtplib".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"urllib.request".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"http.client".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
"socket".msg = "canopy makes no network calls; a sink command does (DESIGN §20)."
# Tests patch with unittest.mock, as context managers (AGENTS.md, Testing).
"pytest.MonkeyPatch".msg = "Patch with `mock.patch`, `mock.patch.object`, or `mock.patch.dict` in a `with` block."
# A mock is specced, so a call the real thing would refuse fails the test (AGENTS.md, Testing).
"unittest.mock.Mock".msg = "Spec it: `mock.patch.object(..., autospec=True)` or `mock.create_autospec(...)`."
"unittest.mock.MagicMock".msg = "Spec it: `mock.patch.object(..., autospec=True)` or `mock.create_autospec(...)`."
# Every command line is click (D025). The workspace members turn TID251 off below, so review holds them to it.
"argparse".msg = "Every command line is click (D025)."
# A write to a journal table goes through its row type, which holds each column and value to the table (D125).
"canopy.core.sql.insert".msg = "Write through the table's row type: records.insert."
"canopy.core.sql.insert_rows".msg = "Write through the table's row type: records.insert_rows."
"canopy.core.sql.insert_from".msg = "Write through the table's row type: records.insert_from."
"canopy.core.sql.update".msg = "Write through the table's row type: records.update."
"canopy.core.sql.delete".msg = "Write through the table's row type: records.delete."

# `from unittest import mock`, then `mock.patch`, `mock.create_autospec` (AGENTS.md, Testing).
[tool.ruff.lint.flake8-import-conventions]
banned-from = ["unittest.mock"]

[tool.ruff.lint.per-file-ignores]
# The subprocess boundary (D015). Arguments are an argv list, never a shell string.
"src/canopy/infra/procs.py" = ["TID251", "S603"]
"tests/**" = [
    "ARG001",  # Fixtures requested only for their side effects (fakes on PATH, state files set).
    "D1",      # Docstrings are optional in tests; test names are the documentation. One that is there is checked.
    "DOC",     # Same as D: a test's docstring, when it has one, needs no sections.
    "PLR0917", # pytest passes fixtures as positional arguments; a test's signature is its fixture list.
    "PLR2004", # Expected exit codes and counts are clearer inline than as named constants.
    "S101",    # pytest asserts.
]
# A click command's docstring is its --help text, so Returns and Raises sections would print there. Every command
# returns an exit code and raises CliError for main to report; that is main's contract, not each command's.
"src/canopy/cli/*" = ["DOC201", "DOC501"]
# The fakes are standalone scripts that talk on stdout and stderr.
"tests/fakes/*" = ["T201"]
# The sandbox wrapper is a separate program, not canopy (DESIGN §24): it runs git and srt, and reports on
# stderr.
"packages/canopy-sandbox/**" = ["T201", "TID251"]
# The GitHub programs are separate programs whose job is the token and the calls the harness never holds or makes
# (DESIGN §29): they run gh for its token and talk to GitHub's API.
"packages/canopy-github/**" = ["TID251"]
# The wheel's build hook runs npm (D079); it is part of packaging, not of canopy.
"hatch_build.py" = ["S603", "TID251"]
# The review bench is a separate program whose job is running git and gh against a copy of a repository.
"packages/canopy-review-bench/**" = ["TID251"]
# Its commands' docstrings are their --help text, so a Raises section would print there.
"packages/canopy-review-bench/src/canopy_review_bench/__init__.py" = ["DOC501"]
# FastAPI reads a route's annotations at runtime to validate and to build the schema, so its models and dependencies
# are imported for real (TC001). A route's docstring is its description in the schema, and the errors it answers are
# its decorator's `responses`, so Returns, Yields, and Raises sections would only repeat them there.
"src/canopy/serve/api/*" = ["DOC201", "DOC402", "DOC501", "TC001"]
# The API's models are pydantic's, built on schema.Model, which ruff cannot see is pydantic's from another module:
# pydantic copies a field's mutable default for each instance (RUF012).
"src/canopy/serve/schema/*.py" = ["RUF012"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# With -n, an idle xdist worker takes queued tests from a busy one, so a few slow tests do not leave the others waiting
# at the end. A run without -n stays serial.
addopts = ["--dist", "worksteal"]
# Every strictness option pytest has, and any it adds. A warning fails the test that raised it, so a deprecation is
# fixed when it appears instead of when the dependency removes the API.
strict = true
# Later entries win.
filterwarnings = [
    "error",
    # procs.spawn detaches its child on purpose, so Popen warns that it is still running.
    "ignore:subprocess \\d+ is still running:ResourceWarning",
]

# What coverage measures: canopy and its workspace members, not the tests or the fakes.
[tool.coverage.run]
branch = true
source_pkgs = [
    "canopy",
    "canopy_artifacts",
    "canopy_github",
    "canopy_jira",
    "canopy_notify_slack",
    "canopy_review_bench",
    "canopy_sandbox",
]

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "assert_never\\("]

# Strict preset (D017). The fakes are extensionless, so list them explicitly.
[tool.pyrefly]
preset = "strict"
project-includes = [
    "src",
    "vercel_app.py",
    "packages",
    "tests",
    "tests/fakes/agent",
    "tests/fakes/github",
    "tests/fakes/srt",
    "tests/fakes/treehouse",
]
# Tests are packages under the repository root (D019) and import shared helpers from `tests.conftest`.
search-path = [
    "src",
    "packages/canopy-artifacts/src",
    "packages/canopy-github/src",
    "packages/canopy-jira/src",
    "packages/canopy-notify-slack/src",
    "packages/canopy-review-bench/src",
    "packages/canopy-sandbox/src",
    ".",
]

# Markdown: every default rule. Tables and code blocks may run past the line length: neither can be wrapped.
[tool.rumdl]
line-length = 120
# Agent definitions open with front matter and CLAUDE.md with an include, not a heading.
disable = ["MD041"]
# Generated design explorations, kept as they were rendered, and test snapshots, compared byte for byte.
exclude = ["docs/ui-explorations", "**/__snapshots__"]

[tool.rumdl.MD013]
tables = false
code-blocks = false

[tool.rumdl.per-file-ignores]
# A worker's last line of output is one JSON object, so the prompt shows it on one line.
".agents/prompts/worker-*.md" = ["MD013"]
".agents/prompts/task.md" = ["MD013"]
# The guide's screenshot serves this as src/guide/overview.md, so its links name the guide's pages, not files beside it.
"ui/e2e/guide-specimen.md" = ["MD057"]
