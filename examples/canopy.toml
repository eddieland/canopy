# canopy.toml - committed at the repository root, shared by everyone who runs canopy on it.
# Written by `canopy init` if the repository has none. Shared keys only; personal settings
# live in ~/.config/canopy/config.toml (see examples/config.toml and DESIGN.md §12).

[tracker]
# Any tracker your agent runtime reaches through an MCP server. Free-form name;
# it tells agents what they are talking to and selects the optional
# tracker-<provider> skill. Skills ship for "jira" and "github".
provider = "jira"
needs_human_label = "needs-human"
# How to find candidate tickets: the tracker's own search syntax, or plain
# language if it has none. Finding is not authorizing; each operator's own
# labels are checked on every ticket regardless of what the query returns.
query = 'project = PROJ AND statusCategory != Done ORDER BY priority DESC, created ASC'

# GitHub Issues instead:
# provider = "github"
# query = 'repo:owner/name is:issue is:open'

[policy]
# The repository may only tighten these: lower limits or longer cooldowns than the defaults.
max_fix_ci_attempts = 2
fix_ci_cooldown_minutes = 30
max_resume_attempts = 3

[trust]
branch_prefix = "agent/"
pr_label = "agent"
