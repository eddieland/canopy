# canopy-workspace.toml - the map of a workspace: the repositories that share one queue (DESIGN §18), one or more.
# Written by `canopy init`. It is canopy's only shared config; no code repository holds any (D016). Shared keys only:
# your own settings live in .canopy/config.toml, this workspace's private file, or in ~/.config/canopy/config.toml for
# every workspace. Commit it if the workspace is shared.
#
# `canopy workspace sync` makes the workspace match this map: it clones what is listed and removes a clone that is no
# longer listed, when nothing in it would be lost. Pool sizes are personal: capacity.slots_per_repo in your user file.
#
# Layout under the workspace root: repos/<name> (clones; `canopy workspace sync`), .treehouse/ (the pools), .canopy/
# (journal, logs, attention.md; readable only by you), and MAP.md (prose about the repositories, for the overseer).

[workspace]
name = "acme"

# One table per repository. The name is its directory under repos/ and what the overseer passes as --repo.
[repos.api]
url = "https://github.com/acme/api.git"
summary = "Public REST API. Owns the order schema and the generated OpenAPI spec."
# Optional: a branch's page on the repository's host, with {branch} where its name goes, for the web UI's links. A
# GitHub url gives one by default (.../tree/{branch}); set this for another host, or to "" for no links.
# branch_url = "https://gitlab.com/acme/api/-/tree/{branch}"
# Optional: paths from the repository's root whose change makes a review high impact whatever the reviewer says, its
# items first on the attention list. Each covers itself and everything under it; no globs. They add to
# .github/workflows/, which is high impact in every repository and cannot be removed. canopy's own lists its agents:
# high_impact_paths = [".agents/", "docs/TRUST_MODEL.md"]

# Optional: the checks that are not CI, each by its exact name. canopy does not wait on one, count it red, or need it to
# pass. Every check not named here is CI. "human" waits on a person, such as a deploy approval or an ownership check,
# and is shown with the PR's checks; "merge" gates the merge itself, such as a merge queue's status, never green on an
# open PR; "ignore" is advisory or retired. "merge" and "ignore" are not shown.
# [repos.api.checks]
# "deploy/approval" = "human"
# "merge-queue" = "merge"
# "lint-legacy" = "ignore"

[repos.web]
url = "https://github.com/acme/web.git"
summary = "Customer web app. Consumes the api's generated client from a release."

[tracker]
provider = "jira"
# Added by a worker that needs an answer, removed when it resumes. Any label your tracker accepts; it must
# already exist, since canopy does not create labels.
needs_human_label = "needs-human"
query = 'project = ACME AND statusCategory != Done ORDER BY priority DESC, created ASC'
# Optional: a ticket's page, with {key} where its key goes. The web UI links each ticket there.
# ticket_url = "https://acme.atlassian.net/browse/{key}"

[trust]
branch_prefix = "agent/"
