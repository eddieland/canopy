# Your own config, never committed: a workspace's private file, .canopy/config.toml under its root, or the user file,
# ~/.config/canopy/config.toml ($XDG_CONFIG_HOME/canopy/config.toml), which serves every workspace. Either overrides
# canopy-workspace.toml key by key, and the private file overrides the user file. Keys marked private in DESIGN §12 may
# be set only in these two. Every key, most at its default. `canopy init` writes only tracker.labels and the trust
# lists, to the private file: add your tracker source ([connect.sources], required), and set the rest only to change
# them.

[tracker]
# Your queue. A ticket is yours if it carries any of these labels. Never share a
# label with another operator: both loops would work the same tickets.
labels = ["agent-ready-yourname"]
# Optional: narrow the workspace's query to your labels to save the overseer reads. It applies in every workspace.
# query = 'project = PROJ AND labels in (agent-ready-yourname) AND statusCategory != Done'
# Optional: run the query at most this often, in minutes, to save its cost. A tick sooner than that after the last
# one that ran it works the tickets canopy already knows, so a newly labeled ticket can wait this long to be found.
# 0 runs it every tick (DESIGN §7, Spacing the query).
# query_every_minutes = 0
# Optional: your own needs-human label, if it differs from the workspace's.
# needs_human_label = "needs-human"
# For tickets you work privately with `canopy start` (DESIGN §22): the tracker's MCP server, as your OpenCode config
# names it, and the only tools of it a private worker may call. Every other tool of that server is denied. Unset, the
# defaults for "jira" (Atlassian's server, named "atlassian") and "github" (GitHub's, named "github") apply. With
# Atlassian's server, use its `?tools=all` URL: without it, most Jira tools hide behind `execute*` tools, which are
# denied.
# mcp_server = "atlassian"
# read_tools = ["getJiraIssue", "searchJiraIssuesUsingJql", "listJiraIssueComments"]

[capacity]
max_workers = 2
# Chore runs at once, apart from max_workers; 0 turns every chore off (DESIGN §19).
max_chores = 1
# Runs of your one-off tasks (`canopy task submit`) at once, within max_workers; 0 starts none (DESIGN §36).
# max_tasks = 1
# Slots in each repository's pool. `canopy workspace sync` makes and removes slots to match, and no run grows a pool
# past it. Unset leaves the pools to treehouse's own max_trees (DESIGN §18).
# slots_per_repo = 2
# [capacity.repo_slots]   # per repository, by its name in the map; wins over slots_per_repo
# api = 4

[runtime]
# The major version of OpenCode canopy runs: 1, the default, or 2 for OpenCode 2.1.4 or later, whose MCP servers each
# need `"codemode": false` (D077). A template you leave out is the version's default; OpenCode 2's start a private
# server of their own (`--standalone`).
# version = 1
# {definitions_dir} is the directory canopy's agent definitions and skills are in (D040). Every template that runs one
# of canopy's agents must contain it. OpenCode reads it as OPENCODE_CONFIG_DIR, after the repository's own config.
# {title}, optional, is the session's title: `<KEY> <kind>: <the ticket's title>` for a worker (DESIGN §13).
overseer_cmd = '''env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-overseer --format json
    --title={title} {prompt}'''
# The overseer's temperature: -1 sends none, for when the overseer runs on a model that refuses one, such as OpenAI's
# reasoning models. review_temperature, below, does the same for the reviewer's.
# overseer_temperature = 0.1
worker_cmd   = '''env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-worker --format json
    --title={title} {prompt}'''
# A ticket you started with `canopy start` runs `private_worker_cmd`: worker_cmd's default with
# `--agent canopy-worker-private`, an agent that cannot write to the tracker (DESIGN §22).
# Chores run this unless they set their own `cmd` (DESIGN §19).
chore_cmd    = '''env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-chore --format json
    --title={title} {prompt}'''
# The planner writes a ticket's plan before its first implement, reading only (DESIGN §25).
plan_cmd     = '''env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-planner --format json
    --title={title} {prompt}'''
# The reviewer's temperature (DESIGN §21): -1, the default, sends none, since the reviewer often runs on a model that
# refuses one, such as OpenAI's reasoning models. Set a low one when it runs on a model that takes it: each new
# commit is reviewed again, and a cooler reviewer's findings wander less from one commit to the next.
# review_temperature = 0.1
overseer_timeout_minutes = 15
worker_timeout_minutes = 45
# Optional: a skill of yours that workers open PRs with, and in no other way, instead of the GitHub MCP (DESIGN §8).
# Put it where your runtime reads skills (a $HOME skill must be a single SKILL.md), and any program it runs on the PATH
# of the shell that runs canopy. If a worker cannot find it, the run fails rather than using the MCP.
# pr_skill = "acme-open-pr"
# Optional: run in each slot once the run's branch is checked out, before the worker, with CANOPY_REPO naming the
# repository; a failure or timeout ends the run crashed (DESIGN §9). It runs the branch's code on this machine. No
# shell runs it: write `sh -c '...'` for one. Plans and reviews run none.
# setup_cmd = "sh -c 'pnpm install --frozen-lockfile'"
# setup_timeout_minutes = 30
# Optional: words before and after every command a worker run starts (worker_cmd, private_worker_cmd, and plan_cmd),
# with {definitions_dir} and {title} but no {prompt}. One place for a sandbox wrapper (docs/SANDBOX.md), or an option
# all three take, but a model: [runtime.models] chooses that.
# worker_cmd_prefix = "canopy-sandbox worker --read {definitions_dir} --"
# worker_cmd_suffix = "--log-level INFO"
# Optional: commands an agent may run beyond its own bash rules, such as a tracker's CLI for the overseer while its MCP
# server is down. An allow in your runtime's own config cannot beat canopy's deny; these can (DESIGN §13). The
# overseer, planner, worker, and worker-private take them; the overseer, which acts through canopy's tools and has no
# shell otherwise, and the planner run only these, and a worker every command but those its rules deny, so for one an
# allow undoes a deny, such as the private worker's of a tracker's CLI (TRUST_MODEL T6). canopy refuses a shell, an
# interpreter, a wrapper such as env or xargs, git, gh, curl, and its own tools, and you answer for what an allowed
# command can do (TRUST_MODEL T1). Tell the overseer when to use them in paths.overseer_instructions, and the planner
# and workers in paths.worker_instructions. `canopy agents` lists them.
# [runtime.allow_bash]
# overseer = ["jira issue list *", "jira issue view *"]
# planner = ["jira issue view *"]
# worker-private = ["jira issue view *"]
# Optional: each agent's model, `provider/model` as `opencode models` lists it, or `provider/model@variant` to run it at
# one of the variants `opencode models --verbose` lists for it, such as a reasoning effort (DESIGN §13). canopy writes
# it into the agent's definition and records it on each worker run; an agent not named runs on OpenCode's default. A
# template, prefix, or suffix that passes --model, -m, or --variant is refused, since it would override this unseen.
# Before a worker run starts, its model and variant are looked up in `opencode models`: one not listed, or a list that
# cannot be read, refuses the run with an attention item, never running it on another model. Private, as every
# runtime key is.
# One ticket's worker, planner, or reviewer can take another model, to canary it: `canopy model KEY MODEL`, or the
# ticket's page.
# [runtime.models]
# worker = "provider/model"     # both workers, and your tasks' runs
# planner = "provider/model"
# reviewer = "provider/other-model@high"
# overseer = "provider/model"
# chore = "provider/model"      # every chore without a model of its own

[loop]
# `canopy loop` waits this long after each tick ends. Every tick runs the overseer, so this sets its spend.
interval_minutes = 15
# After each tick that found nothing new, the wait doubles, up to this. It ends sooner when a run ends, the CI
# cooldown or a chore's due time comes, or you reply. Set it to interval_minutes to wait the same after every tick.
# idle_max_minutes = 120
# No tick starts sooner than this after the last one ended, whatever wakes the loop, unless you press t at its terminal.
# min_gap_minutes = 1
# No tick runs the overseer, so none starts work, while the disk holding .canopy/ or the workspace has less free than
# this, in MiB; you are told through the attention list. 0 turns the check off.
# min_free_disk_mib = 2048

[spend]
# What a calendar month of agent spend should cost, in whole US dollars: canopy's runs and every session of the runtime
# outside canopy that `canopy loop` has read, canopy's share shown beside the whole. Nothing stops at it: `canopy spend`
# and the web UI's spend page track the month against it, and a sink that takes `loop` events hears once when the
# month reaches it.
# monthly_budget_usd = 300
# Percentages of it at which that sink also hears, each once a month: a warning at half and at four fifths, here. The
# 100% alert is always sent. Empty by default.
# budget_alerts = [50, 80]

[trust]
# Tracker account ids whose ticket comments may resume your blocked work. Use the
# tracker's stable id, not a display name: Jira accountId, GitHub login.
authorized_repliers = ["replace-with-your-account-id"]
# GitHub logins whose PR review comments a worker may address without asking you, and "canopy:review" for canopy's own
# reviewer ([review]). Anyone else's comments, a review bot's included, wait on the attention list as untrusted_review
# until you answer with `canopy reply KEY '...'` or the web UI: what to do about them, or leave them. Empty: all wait.
trusted_reviewers = ["replace-with-your-github-login"]
# Every comment a worker posts starts with the prefix and ends with the suffix, each if set; set at least one.
# Workers post as you, so this is how canopy tells their comments from yours: a comment that carries every mark
# set is never feedback or an instruction.
comment_prefix = "CANOPY:"
comment_suffix = ""
# The Co-authored-by trailer git adds to every commit a worker makes, through canopy's hooks. Name an agent
# here, such as your team's bot address, never a person: it is how a reader tells the work is an agent's. Left as the
# default, the name credits the model [runtime.models] chooses for the worker, as "provider/model (canopy worker)",
# and a worker following an approved plan adds a second trailer for its planner's, "provider/model (canopy planner)";
# a name you set is used as you set it, alone. Set commit_trailer = false to add none, keeping only the runtime's own
# attribution, if it adds any.
# commit_trailer = true
# commit_trailer_name = "canopy worker"
# commit_trailer_email = "noreply@canopy.invalid"
# Text git puts before the subject of every commit a worker makes, "{key}" filled with its ticket's key, as
# "[PROJ-123] ", but a fixup!, squash!, or amend! commit's, which --autosquash matches by its subject. A task's run,
# which has no ticket, gets none that names "{key}". Empty: none.
# commit_prefix = ""
# Set if your repositories refuse merge commits: workers then rebase onto a base branch instead of merging it in, and
# push the result with --force-with-lease to their own branch, never any other force (TRUST_MODEL T1).
# rebase = false
# How many times canopy reruns a PR's checks a worker judged flaky, for each head pushed, by rebasing the branch onto
# its base and pushing it with --force-with-lease (DESIGN §23, TRUST_MODEL T1). 0: you rerun them yourself.
# max_flaky_kicks = 0
# How replies to review comments, and every other comment a worker would post, reach GitHub (DESIGN §29): "post" has
# workers post them, marked; "approve" has them draft each one for you to read, edit, and send as your own words.
# review_replies = "post"

[paths]
prompt_overrides = "~/.config/canopy/prompts"
# Optional: your own .worktreeinclude, passed to every `treehouse get`. It replaces the committed one: copy in its lines
# to keep them. It selects gitignored files in the primary clone to copy into each slot (DESIGN §9).
# worktree_include = "~/.config/canopy/worktreeinclude"
# Optional: a few lines every worker should follow, such as "commit review fixes with `git commit --fixup`". They go
# into every worker's prompt, at most 4 KiB, so you need not copy a prompt to add them (DESIGN §12).
# worker_instructions = "~/.config/canopy/worker-instructions.md"
# Optional: the same for the overseer, such as "dispatch tickets labeled urgent before the rest". They go at the end of
# its prompt, at most 4 KiB, and never reach a worker (DESIGN §12).
# overseer_instructions = "~/.config/canopy/overseer-instructions.md"
# Optional: the same for every reviewer, such as "treat a missing migration test as a finding", and for every chore
# run, after the chore's own prompt, such as "name a CI job by its workflow file". Each at most 4 KiB (DESIGN §12).
# reviewer_instructions = "~/.config/canopy/reviewer-instructions.md"
# chore_instructions = "~/.config/canopy/chore-instructions.md"
# Optional: your own personas, each `<name>.md`, at most 4 KiB. One named as canopy's shadows it; `canopy personas`
# lists them all (DESIGN §31).
# personas = "~/.config/canopy/personas"
# Optional: a clone of a private repository of yours. A live tick copies every plan of the workspace into
# <clone>/<workspace>/, with its status and approval, commits, and pushes to the clone's upstream (DESIGN §25). Plans
# hold what planners read of your tickets: keep the repository private. `canopy archive DIR` does the copy by hand.
# plan_archive = "~/src/plans"
# The least time between archives, from the archive's last commit in the clone, so its remote is pushed to a few times
# a day. A push that failed is retried each tick all the same. 0 archives every tick.
# plan_archive_every_minutes = 360
# Set false to archive into the clone's top level rather than <clone>/<workspace>/, for a repository that holds this
# workspace's plans alone. Only what canopy wrote there is committed: each ticket's directory and its own README.md.
# plan_archive_workspace_dir = true
# Each plan goes with the prompt its planner was given, which carries your messages and standing instructions. Set
# false to archive plans alone; `canopy archive DIR` copies prompts either way.
# plan_archive_prompts = true
# Set true to archive each planned ticket's conversation beside its plans too: workers' reports and questions, your
# replies, and mirrored tracker comments, a private ticket's included. `canopy archive DIR --conversations` copies them.
# plan_archive_conversations = false
# Each ticket's plans go with your comments on them, as KEY/COMMENTS.md: every thread, the passage it is on, and its
# replies. Set false to leave them out; `canopy archive DIR` copies them either way. A plan you edited always goes with
# its original, as the planner wrote it, as RUN-ORIGINAL.md.
# plan_archive_comments = true

# Optional: the persona each agent writes in, by name: its voice and what it weighs most, never what it may do. A run
# whose persona has no file is refused, never run in canopy's voice instead (DESIGN §31).
# [personas]
# worker = "canopy"                             # every implement and resume; or "minimalist", "explainer", "eddie"
# planner = "canopy"                            # every plan; or "skeptic", "eddie"
# reviewer = "canopy"                           # every review; or "skeptic", "eddie"

[notify]
# Optional. Receives the attention-list diff on stdin after each tick, as text: the sink named `default`.
cmd = ""

# Optional notification sinks (DESIGN §20): each a command that reads one message on stdin, at most 5.
# [notify.sinks.desktop]
# cmd = "canopy-notify-desktop"
# events = ["attention", "loop", "runs"]        # attention | loop | runs | chores | reviews | tasks
#
# [notify.sinks.slack]
# cmd = "canopy-notify-slack"                   # reads its webhook from ~/.config/canopy/slack-webhook, mode 600
# cmd = "canopy-notify-slack --channel C0123ABCD"  # or a bot token, from ~/.config/canopy/slack-token, mode 600
# events = ["attention", "loop", "runs"]
# digest_every_minutes = 240                    # a summary every 4 hours, what its runs cost by kind among it
# digest_min_usd = 5                            # sent only once the runs since the last one cost $5 or more
# batch_minutes = 15                            # at most one message per 15 minutes, unless something needs you

# Optional: the web UI `canopy loop` serves (DESIGN §22). While it serves one, a json sink's messages link to its pages.
# [serve]
# port = 8765
# url = "http://localhost:9000/"                # where those links open it, such as an SSH forward's port;
#                                               # it replaces the whole address, so add base_path if you set one

# Required: the program that reads your tracker into canopy's journal, a tracker source (DESIGN §30). canopy reads no
# ticket any other way, so config refuses a workspace without one. Exactly one, canopy's Jira Cloud reader here. It
# reads your email and an API token, one line EMAIL:API_TOKEN, from ~/.config/canopy/jira-credentials, mode 600, and
# sends them to this site alone.
[connect.sources.jira]
kind = "tracker"
cmd = "canopy-connect-jira --site acme.atlassian.net"

# Or, with GitHub Issues as the tracker, a tracker source given the repository reads its issues, GH-12 being issue 12,
# and its post_cmd lets canopy post a ticket's drafts too.
# [connect.sources.issues]
# kind = "tracker"
# cmd = "canopy-connect-github --repo acme/api"  # HOST/OWNER/NAME on GitHub Enterprise
# post_cmd = "canopy-post-github"

# Optional: the programs canopy reads GitHub with and posts your approved replies through (DESIGN §29). Unset, the
# vcs source is canopy's own, which use the token `gh` holds for each PR's and repository's host.
# [connect.sources.github]
# kind = "vcs"
# cmd = "canopy-connect-github"
# post_cmd = "canopy-post-github"
# timeout_minutes = 2

# Optional: recurring chores the overseer runs when due (DESIGN §19). The prompt is your own file. A chore that runs
# your own tools sets `cmd` to an agent of yours, defined in ~/.config/opencode/agent/, that allows exactly those tools.
# examples/chores/build-health.md is a prompt to start from: it needs only the shipped agent and a GitHub MCP server.
# `canopy chore install build-health` copies it into .canopy/ and writes this table to the private file; name your
# repositories in the copy, and run `canopy chore try build-health` until its findings are the ones you want.
# [chores.build-health]
# prompt = "~/.config/canopy/chores/build-health.md"
# every_minutes = 120
# days = ["mon", "tue", "wed", "thu", "fri"]   # when a run may start, checked in code; default every day, all day
# hours = "08:00-18:00"
# timezone = "America/New_York"                # default this machine's local time
# when = "Skip it when the last run found nothing."
# timeout_minutes = 20
# workspaces = ["acme"]   # default: every workspace
# model = "provider/model@low"   # default runtime.models.chore; only for a chore that runs canopy-chore

# Optional: adversarial reviews of PRs (DESIGN §21). A fresh reviewer reads each new commit and reports to canopy only:
# it posts nothing on the PR and never approves (D114). Read reviews with `canopy review show`. Point review_cmd at a
# different model than worker_cmd, so the reviewer does not share the author's blind spots.
# [review]
# agent_prs = true                                            # the loop's own PRs, before a human is asked
# query = 'repo:acme/api is:pr is:open author:@me -is:draft'  # your own PRs, reviewed for you alone
# low_impact = "Only docs, comments, or tests change."
# settle_minutes = 30   # review a head once it has been the head this long; a push starts over. 0 to 10080
#
# Cases `canopy review eval` scores the reviewer on, after you change reviewer.md, a persona, or its model; best in the
# workspace's .canopy/config.toml, since each names one of its repositories. A bug case is a change that was reverted or
# fixed forward, with the lines you confirmed its bug on ("path:line" or "path:first-last"); a clean one, one you know
# is sound, counts every finding as a false alarm. sha is the commit reviewed, base the commit its change starts from.
# [[review.eval_cases]]
# name = "retry-forever"
# pr = "https://github.com/acme/api/pull/412"
# repo = "api"
# sha = "<the PR's head, 40 hex characters>"
# base = "<its merge base with main>"
# kind = "bug"
# lines = ["src/retry.py:42"]

# Optional: an artifact store workers publish pages to for people to comment on (DESIGN §38), Louvre or canopy's local
# one, `canopy-artifacts serve`, each an MCP server your runtime config names. Every agent's definition denies the
# server but those publish_roles names; "worker" is the one role that may publish, and only for public tickets.
# [artifacts]
# mcp_server = "louvre"
# namespace = "canopy/operator"
# authorized_authors = ["u_ana", "u_raj"]     # whose comments steer a worker; anyone else's waits on attention
# publish_roles = ["worker"]
#
# And a source that reads the store's comments into canopy's journal each tick, the local store's feed here; each
# comment reaches its ticket's conversation, counting as authorized_authors says (DESIGN §30, §38).
# [connect.sources.artifacts]
# kind = "artifacts"
# cmd = "canopy-artifacts feed --store /path/to/your/store --namespace canopy/operator"
#
# And, with the Slack sink on a bot token and --threads, a source that reads the replies in its ticket threads (ROADMAP
# M64). A reply from an id in `operators` is your message on the ticket, as `canopy reply` records one: list only your
# own Slack member id. So is `@canopy PROJ-123 your reply` in the channel, for a ticket with no thread; add "replies"
# to the sink's events to see what came of it. The bot also needs channels:history (groups:history for a private
# channel). --channel is the sink's own, by id.
# [connect.sources.slack]
# kind = "slack"
# cmd = "canopy-connect-slack --channel C0123ABCD"
# operators = ["U0123ABCD"]

# Traces of what canopy does, as OpenTelemetry spans (DESIGN §12): each tick and its steps, and each run it starts.
# Off by default, and private. `file` appends each span, as OTLP JSON, to .canopy/traces.jsonl, readable by you alone,
# for a collector you run (an OpenTelemetry Collector's `otlpjsonfile` receiver) to send on. Nothing leaves the machine.
# [telemetry]
# traces = "off"         # or "file"

# Optional: how long canopy keeps its own history (DESIGN §26); 0 keeps a kind forever. `canopy gc --dry-run` shows
# what each kind holds and what a pass would remove. A live tick removes the files and the journal's rows once a day,
# and rotates canopy.log; `canopy gc --vacuum`, between ticks, gives the journal's free pages back to the disk, and
# `canopy gc --git` packs the primary clones' loose objects.
# [retention]
# run_files_days = 30    # a run's, chore run's, or review's log, prompt, and diff, once it ended this long ago
# tick_files_days = 7    # a tick's log and prompt; a tick not `ok` keeps them for run_files_days
# journal_days = 90      # harness attention rows, connector runs, derivations, past the attention list's window
# log_max_mib = 50       # canopy.log is rotated past this
# log_keep = 3           # and this many rotated files are kept
# memory_days = 30       # the text of a note or proposal no longer in force; a lesson's is never removed
