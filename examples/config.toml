# ~/.config/canopy/config.toml ($XDG_CONFIG_HOME/canopy/config.toml) - personal, never committed.
# Written by `canopy init` if missing. Overrides the repository's canopy.toml key by key.
# Keys marked user-only in DESIGN.md §12 may be set only here.

[tracker]
# Your queue. A ticket is yours if it carries any of these labels. Never share a
# label with another operator: both loops would work the same tickets.
labels = ["agent-ready-yourname"]
# Optional: narrow the repository's query to your labels to save the overseer reads.
# query = 'project = PROJ AND labels in (agent-ready-yourname) AND statusCategory != Done'

[capacity]
max_workers = 2

[runtime]
# {definitions_dir} is the directory canopy's agent definitions and skills are in (D040). Every template that runs one
# of canopy's agents must contain it. OpenCode reads it as OPENCODE_CONFIG_DIR, after the repository's own config.
overseer_cmd = 'env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-overseer {prompt}'
worker_cmd   = 'env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-worker {prompt}'
# Runs a split: one ticket covering several repositories becomes a ticket per repository (DESIGN §18).
split_cmd    = 'env OPENCODE_CONFIG_DIR={definitions_dir} opencode run --agent canopy-splitter {prompt}'
overseer_timeout_minutes = 15
worker_timeout_minutes = 45

[loop]
# `canopy loop` waits this long after each tick ends. Every tick runs the overseer, so this sets its spend.
interval_minutes = 15

[trust]
# Tracker account ids whose ticket comments may resume your blocked work. Use the
# tracker's stable id, not a display name: Jira accountId, GitHub login.
authorized_repliers = ["replace-with-your-account-id"]

[paths]
prompt_overrides = "~/.config/canopy/prompts"
# Journal, logs, and attention.md. A workspace of several repositories ignores this and keeps its own in .canopy/.
state_dir = "~/.canopy"

[notify]
# Optional. Receives the attention-list diff on stdin after each tick.
# Example: a two-line script that posts to a Slack webhook.
cmd = ""
