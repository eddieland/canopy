# Codecov's settings. ci.yml uploads coverage.xml from the lint-and-test job and ui/coverage/lcov.info from the ui-check
# job, which run side by side. Its commit statuses are informational: they report project and patch coverage on each PR
# but never fail one, since no milestone sets a coverage bar.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# No PR comment: the statuses and codecov.io carry the numbers, and a comment on every push is noise in the thread.
comment: false

# Two uploads per commit, one from each job: Codecov reports only once both arrive, not on the half that came first.
codecov:
  notify:
    after_n_builds: 2

# Components show the Python and the web UI's coverage apart on codecov.io.
component_management:
  individual_components:
    - component_id: python
      name: Python
      paths:
        - src/**
        - packages/**
    - component_id: ui
      name: Web UI
      paths:
        - ui/**
