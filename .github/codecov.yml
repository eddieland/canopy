# Codecov's settings. ci.yml uploads a coverage.xml from each slice of the test job and ui/coverage/lcov.info from the
# ui-check job, which run side by side. Its commit statuses are informational: they report project and patch coverage
# on each PR but never fail one, since no milestone sets a coverage bar.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# No PR comment: the statuses and codecov.io carry the numbers, and a comment on every push is noise in the thread.
comment: false

# Nine uploads per commit, one from each of the test job's eight slices, four under each runtime version, and one from
# ui-check: Codecov reports only once all arrive, not on the part that came first. Each carries its flag, python or
# ui, and the slices each a name of their own, python-1-1 to python-2-4, which Codecov merges under the python flag.
# The uploader names every job's upload alike (the run id and the workflow's name), so without flags Codecov kept
# only one of two, and a commit showed only the UI's coverage. Keep the count in step with the test job's matrix.
codecov:
  notify:
    after_n_builds: 9

# A job that fails skips its upload, so a commit can arrive with one flag's coverage and not the other's. Carryforward
# fills the missing flag from the nearest parent that has it, so the commit, and main's head on codecov.io, still show
# both the Python and the web UI's coverage.
flag_management:
  default_rules:
    carryforward: true

# Components show the Python and the web UI's coverage apart on codecov.io.
component_management:
  individual_components:
    - component_id: python
      name: Python
      paths:
        - src/**
        - packages/**
    - component_id: ui
      name: Web UI
      paths:
        - ui/**
