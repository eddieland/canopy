# Codecov's settings (ci.yml uploads coverage.xml and ui/coverage/lcov.info from `make check COVERAGE=1`). Its commit
# statuses are informational: they report project and patch coverage on each PR but never fail one, since no milestone
# sets a coverage bar.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

# No PR comment: the statuses and codecov.io carry the numbers, and a comment on every push is noise in the thread.
comment: false

# One upload carries both reports; components show the Python and the web UI's coverage apart on codecov.io.
component_management:
  individual_components:
    - component_id: python
      name: Python
      paths:
        - src/**
        - packages/**
    - component_id: ui
      name: Web UI
      paths:
        - ui/**
