name: CI

# merge_group runs every check on what a merge queue would land: the pull request on top of main and of any ahead of it
# in the queue. Two pull requests each green on its own base can still break main together, as a test one adds for
# behavior the other changes; the queue catches that before either lands. Branch protection turns the queue on.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every uv command refuses a uv.lock that is out of date with pyproject.toml, not only the explicit `uv sync
# --locked`: the `uv run` calls after it, in make and npm scripts, would otherwise re-lock and sync quietly.
env:
  UV_LOCKED: "1"

# A pull request's runs and a manual run on its branch, such as the one the Screenshots workflow starts after pushing
# baselines, share a group by branch name, so a newer one cancels the older and the branch holds runners for one run at
# a time. A fork's pull request is grouped by its number instead, since two forks can both use `main`. Every other run
# has a group of its own: GitHub cancels a run left pending in a shared group, so merges in quick succession left many
# of main's commits untested, and without coverage on Codecov.
concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && (
        github.event.pull_request.head.repo.full_name == github.repository && github.head_ref
        || github.event.pull_request.number
      )
      || github.event_name == 'workflow_dispatch' && github.ref_name
      || github.run_id
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}

jobs:
  # A pull request that changes only docs needs none of the checks below, so they are skipped and take no runner;
  # `ci-passed` accepts a skip only when this job said code=false. Docs are anything under docs/ and any Markdown file
  # outside .agents/, src/, and packages/, whose Markdown ships in the wheel, and below ui/'s top level, where the
  # guide's pages are bundled into the UI. One that changes only ui/ and docs (python=false) skips the Python tests,
  # the sandbox canary, and the pool contract, none of which reads ui/; the lint still runs, since it covers ui/'s
  # files too. Pushes to main and manual runs always check everything, so whatever a PR's skips let through fails there.
  # The jobs that need this one run even if it fails, and anything but code=false or python=false runs them in full, so
  # an unexpected output checks too much, never too little.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
      python: ${{ steps.classify.outputs.python }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # --no-renames lists both sides of a rename, so moving code into docs/ still counts as a code change. A case
      # pattern's * matches a slash, so ui/*/* is anything below ui/'s top level, Markdown included.
      - name: Classify the changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            echo "python=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          python=false
          while IFS= read -r file; do
            case "$file" in
              docs/*) ;;
              .agents/* | src/* | packages/*) code=true python=true ;;
              ui/*/*) code=true ;;
              *.md) ;;
              ui/*) code=true ;;
              *) code=true python=true ;;
            esac
          done <<<"$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "python=$python" >>"$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Only docs changed; the checks pass without running." | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ "$python" = false ]; then
            echo "Only ui/ and docs changed; the Python tests, sandbox canary, and pool contract are skipped." \
              | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # For the OIDC token the Codecov upload authenticates with.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        run: uv sync --locked

      # `make check` is these two and `ui-check`, which runs in the job below so neither waits on the other.
      # `make all` would run `fmt`, which rewrites files; these only verify. `lint` includes `ruff format --check`,
      # so unformatted code still fails.
      - name: Lint and type check
        run: make lint

      # COVERAGE=1 writes coverage.xml for the Python tests. Skipped on a PR that changes only ui/ and docs; Codecov
      # carries the python flag forward from the parent (.github/codecov.yml).
      - name: Test
        if: needs.changes.outputs.python != 'false'
        run: make test COVERAGE=1

      # Codecov authenticates with the run's OIDC token, so no secret is needed; the repository only has to be added
      # on codecov.io. An upload that fails warns and leaves the check green: Codecov being down never blocks a PR.
      # Each job's upload carries its own flag (.github/codecov.yml says why).
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.python != 'false'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.xml
          flags: python
          use_oidc: true
          fail_ci_if_error: false

  # The rest of `make check`: the UI's format, lint, types, generated API types, unit tests, and build (ui/AGENTS.md).
  ui-check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    permissions:
      contents: read
      # For the OIDC token the Codecov upload authenticates with.
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The generated API types are checked against the schema canopy.serve produces.
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: uv sync --locked

      # COVERAGE=1 writes ui/coverage/lcov.info for the UI's unit tests.
      - name: UI checks
        run: make ui-check COVERAGE=1

      # Codecov authenticates with the run's OIDC token, so no secret is needed; the repository only has to be added
      # on codecov.io. An upload that fails warns and leaves the check green: Codecov being down never blocks a PR.
      # Each job's upload carries its own flag (.github/codecov.yml says why).
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ui/coverage/lcov.info
          flags: ui
          use_oidc: true
          fail_ci_if_error: false

  # The sandbox canary (DESIGN §24, The canary): the shipped wrapper and policy templates under the real srt, with
  # bubblewrap, set up the way docs/SANDBOX.md tells the operator to. Linux only: macOS is the operator's to check.
  sandbox-canary:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.python != 'false' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install bubblewrap, socat, and ripgrep
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which leaves bubblewrap without the
      # capabilities it needs. docs/SANDBOX.md gives the operator the same command.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: uv sync --locked

      # Installs the srt the wrapper's lockfile pins, and exits 1 while anything it checks is missing.
      - name: Set up the sandbox
        run: uv run canopy sandbox setup

      # One case runs under the temp directory canopy itself would have.
      - name: Canary
        run: |
          uv run python -c 'import tempfile; print("system temp directory:", tempfile.gettempdir())'
          make sandbox-canary

  # The pool contract (ROADMAP M45, DESIGN §18 What a pool guarantees) against real treehouse, built at the commit
  # `make treehouse` pins. Go is needed only here, as Node is for the sandbox canary: canopy itself never runs it.
  pool-contract:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' && needs.changes.outputs.python != 'false' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Build treehouse at the pinned commit
        run: |
          make treehouse
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Pool contract
        run: |
          treehouse --version
          make pool-contract

  # The web UI end to end: Playwright against the build, served by FastAPI (ui/AGENTS.md).
  ui-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm --prefix ui ci --no-audit --no-fund

      - name: Install Playwright's Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: make ui-e2e

      - name: Keep the report and any screenshot diffs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # README's install step, from this commit, into an empty HOME: the wheel's bundled files, its dependencies' wheels,
  # and the installed `canopy` running a dry tick against the fakes (ROADMAP M5).
  install-check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No cache: the check installs into an empty one of its own, so setup-uv would find nothing to save and fail.
      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      # The wheel's build hook builds the UI with npm, and fails without it.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Install with uv tool install and run a dry tick
        run: make install-check

  # The one check branch protection requires, so a new job, or a new OS in a matrix, needs no change to the ruleset:
  # list the job in `needs` here, or nothing requires it. It runs whatever happened above and fails unless every job
  # it needs succeeded, since a required check that is skipped counts as passing. The exceptions are the skips `changes`
  # asked for, when it succeeded: on a docs-only pull request (code=false) any check it gates, and on one that changes
  # only ui/ and docs (python=false) the sandbox canary and the pool contract.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [changes, lint-and-test, ui-check, sandbox-canary, pool-contract, ui-e2e, install-check]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e '
            (.changes.result == "success") as $classified
            | ($classified and .changes.outputs.code == "false") as $docs
            | ($classified and .changes.outputs.python == "false") as $ui
            | all(to_entries[]; .value.result == "success"
                or (.value.result == "skipped" and .key != "changes"
                  and ($docs or ($ui and (.key == "sandbox-canary" or .key == "pool-contract")))))
          ' <<<"$NEEDS" >/dev/null
