name: CI

# merge_group runs every check on what a merge queue would land: the pull request on top of main and of any ahead of it
# in the queue. Two pull requests each green on its own base can still break main together, as a test one adds for
# behavior the other changes; the queue catches that before either lands. Branch protection turns the queue on.
on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# Every uv command refuses a uv.lock that is out of date with pyproject.toml, not only the explicit `uv sync
# --locked`: the `uv run` calls after it, in make and npm scripts, would otherwise re-lock and sync quietly.
env:
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that changes only docs needs none of the checks below. They still run, so `ci-passed` sees them
  # succeed, but every step is skipped and they pass in seconds. Docs are anything under docs/ and any Markdown file
  # outside .agents/, src/, and packages/, whose Markdown ships in the wheel. Pushes to main and manual runs always
  # check everything, so a Markdown lint error a docs-only PR let through fails there.
  # The jobs that need this one run even if it fails, and anything but code=false runs their steps in full, so an
  # unexpected output checks too much, never too little.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - name: Check out repository
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      # --no-renames lists both sides of a rename, so moving code into docs/ still counts as a code change.
      - name: Classify the changed files
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r file; do
            case "$file" in
              docs/*) ;;
              .agents/* | src/* | packages/*) code=true ;;
              *.md) ;;
              *) code=true ;;
            esac
          done <<<"$(git diff --name-only --no-renames "$BASE_SHA...$HEAD_SHA")"
          echo "code=$code" >>"$GITHUB_OUTPUT"
          if [ "$code" = false ]; then
            echo "Only docs changed; the checks pass without running." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  lint-and-test:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    permissions:
      contents: read
      # For the OIDC token the Codecov upload authenticates with.
      id-token: write
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml.
      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      # `make check` is these two and `ui-check`, which runs in the job below so neither waits on the other.
      # `make all` would run `fmt`, which rewrites files; these only verify. `lint` includes `ruff format --check`,
      # so unformatted code still fails. COVERAGE=1 writes coverage.xml for the Python tests.
      - name: Lint, type check, and test
        if: needs.changes.outputs.code != 'false'
        run: make lint test COVERAGE=1

      # Codecov authenticates with the run's OIDC token, so no secret is needed; the repository only has to be added
      # on codecov.io. An upload that fails warns and leaves the check green: Codecov being down never blocks a PR.
      # Each job's upload carries its own flag (.github/codecov.yml says why).
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code != 'false'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: coverage.xml
          flags: python
          use_oidc: true
          fail_ci_if_error: false

  # The rest of `make check`: the UI's format, lint, types, generated API types, unit tests, and build (ui/AGENTS.md).
  ui-check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    permissions:
      contents: read
      # For the OIDC token the Codecov upload authenticates with.
      id-token: write
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The generated API types are checked against the schema canopy.serve produces.
      - name: Set up uv and Python 3.12
        if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      # COVERAGE=1 writes ui/coverage/lcov.info for the UI's unit tests.
      - name: UI checks
        if: needs.changes.outputs.code != 'false'
        run: make ui-check COVERAGE=1

      # Codecov authenticates with the run's OIDC token, so no secret is needed; the repository only has to be added
      # on codecov.io. An upload that fails warns and leaves the check green: Codecov being down never blocks a PR.
      # Each job's upload carries its own flag (.github/codecov.yml says why).
      - name: Upload coverage to Codecov
        if: needs.changes.outputs.code != 'false'
        uses: codecov/codecov-action@v7.1.1
        with:
          files: ui/coverage/lcov.info
          flags: ui
          use_oidc: true
          fail_ci_if_error: false

  # The sandbox canary (DESIGN §24, The canary): the shipped wrapper and policy templates under the real srt, with
  # bubblewrap, set up the way docs/SANDBOX.md tells the operator to. Linux only: macOS is the operator's to check.
  sandbox-canary:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install bubblewrap, socat, and ripgrep
        if: needs.changes.outputs.code != 'false'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep

      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which leaves bubblewrap without the
      # capabilities it needs. docs/SANDBOX.md gives the operator the same command.
      - name: Allow unprivileged user namespaces
        if: needs.changes.outputs.code != 'false'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      # Installs the srt the wrapper's lockfile pins, and exits 1 while anything it checks is missing.
      - name: Set up the sandbox
        if: needs.changes.outputs.code != 'false'
        run: uv run canopy sandbox setup

      # One case runs under the temp directory canopy itself would have.
      - name: Canary
        if: needs.changes.outputs.code != 'false'
        run: |
          uv run python -c 'import tempfile; print("system temp directory:", tempfile.gettempdir())'
          make sandbox-canary

  # The pool contract (ROADMAP M45, DESIGN §18 What a pool guarantees) against real treehouse, built at the commit
  # `make treehouse` pins. Go is needed only here, as Node is for the sandbox canary: canopy itself never runs it.
  pool-contract:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Go
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: uv sync --locked

      - name: Build treehouse at the pinned commit
        if: needs.changes.outputs.code != 'false'
        run: |
          make treehouse
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      - name: Pool contract
        if: needs.changes.outputs.code != 'false'
        run: |
          treehouse --version
          make pool-contract

  # The web UI end to end: Playwright against the build, served by FastAPI (ui/AGENTS.md).
  ui-e2e:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.code != 'false'
        run: |
          uv sync --locked
          npm --prefix ui ci --no-audit --no-fund

      - name: Install Playwright's Chromium
        if: needs.changes.outputs.code != 'false'
        working-directory: ui
        run: npx playwright install --with-deps chromium

      - name: Playwright
        if: needs.changes.outputs.code != 'false'
        run: make ui-e2e

      - name: Keep the report and any screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # README's install step, from this commit, into an empty HOME: the wheel's bundled files, its dependencies' wheels,
  # and the installed `canopy` running a dry tick against the fakes (ROADMAP M5).
  install-check:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        if: needs.changes.outputs.code != 'false'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No cache: the check installs into an empty one of its own, so setup-uv would find nothing to save and fail.
      - name: Set up uv and Python 3.12
        if: needs.changes.outputs.code != 'false'
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.12"
          enable-cache: false

      # The wheel's build hook builds the UI with npm, and fails without it.
      - name: Set up Node
        if: needs.changes.outputs.code != 'false'
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"

      - name: Install with uv tool install and run a dry tick
        if: needs.changes.outputs.code != 'false'
        run: make install-check

  # The one check branch protection requires, so a new job, or a new OS in a matrix, needs no change to the ruleset:
  # list the job in `needs` here, or nothing requires it. It runs whatever happened above and fails unless every job
  # it needs succeeded, since a required check that is skipped counts as passing.
  ci-passed:
    runs-on: ubuntu-latest
    needs: [changes, lint-and-test, ui-check, sandbox-canary, pool-contract, ui-e2e, install-check]
    if: ${{ always() }}
    timeout-minutes: 5
    steps:
      - name: Check that every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null
