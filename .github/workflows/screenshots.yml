name: Screenshots

# Regenerates the Playwright screenshot baselines on CI's runner, with the Chromium and fonts the ui-e2e check compares
# against, and pushes any that changed to the branch it was run on. On demand only: run it on a branch from the
# Actions tab, `gh workflow run screenshots.yml --ref BRANCH`, or the GitHub API, after a deliberate visual change.
on:
  workflow_dispatch:
    inputs:
      update:
        # `changed` (the default) rewrites only the images that fail the comparison. `all` rewrites every one: for a
        # change subtle enough to pass within the threshold, which `changed` would leave showing the old look.
        description: Which baselines to rewrite
        type: choice
        options: [changed, all]
        default: changed

permissions:
  contents: read

# Every uv command refuses a uv.lock that is out of date with pyproject.toml, not only the explicit `uv sync
# --locked`: the `uv run` calls after it, in make and npm scripts, would otherwise re-lock and sync quietly.
env:
  UV_LOCKED: "1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the branch's code with a read-only token. Same steps as ci.yml's ui-e2e, so the images match what it checks.
  generate:
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm --prefix ui ci --no-audit --no-fund

      # `./`, not the `$/` zizmor asks for: actionlint does not parse `$/` yet.
      - name: Install Playwright's Chromium
        uses: ./.github/actions/playwright-chromium # zizmor: ignore[self-repository]

      # `changed` rewrites only the images that fail the comparison, and writes missing ones, so antialiasing noise
      # within the threshold does not churn the rest; `all` rewrites every image. Only the spec files that take a
      # screenshot run, found by what they call, so a new one is picked up unlisted: the rest of the suite is three
      # quarters of the time and writes no image. A failing test in them fails the run and nothing is pushed; the CI
      # run started on the pushed commit runs the whole suite.
      - name: Playwright, updating the baselines
        working-directory: ui
        env:
          UPDATE: ${{ inputs.update || 'changed' }}
        run: |
          mapfile -t specs < <(grep -lE 'toHaveScreenshot|screenshot(Main|Whole)\(' e2e/*.spec.ts)
          if [ "${#specs[@]}" -eq 0 ]; then
            echo "::error::No spec file takes a screenshot."
            exit 1
          fi
          printf 'Taking screenshots in %s\n' "${specs[@]}"
          npm run test:e2e -- --update-snapshots="$UPDATE" "${specs[@]}"

      # Recompresses the images this run wrote with oxipng, losslessly: the same pixels, about a fifth smaller, so each
      # regeneration adds less to the history. Only those images, so the rest keep their bytes. A pinned release,
      # checked against its digest; Ubuntu packages none. `make screenshots` (ui/scripts/screenshots.sh) reads this pin.
      - name: Optimize the images written
        env:
          OXIPNG_VERSION: 10.0.0
          OXIPNG_SHA256: ed61396908e17dd8971decfebd7c64c0b8bc0a8107f9a7e29661f9335ce8158c
        run: |
          mapfile -t pngs < <(git ls-files --modified --others --exclude-standard -- 'ui/e2e/*-snapshots/*.png')
          if [ "${#pngs[@]}" -eq 0 ]; then
            echo "No image written; nothing to optimize."
            exit 0
          fi
          name="oxipng-${OXIPNG_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL -o "$RUNNER_TEMP/oxipng.tar.gz" \
            "https://github.com/shssoichiro/oxipng/releases/download/v${OXIPNG_VERSION}/${name}.tar.gz"
          echo "${OXIPNG_SHA256}  ${RUNNER_TEMP}/oxipng.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/oxipng.tar.gz" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/$name/oxipng" --quiet --opt 4 --strip safe "${pngs[@]}"

      - name: Keep the baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: ui/e2e/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # Holds the write token and runs none of the branch's code: it commits the images and nothing else.
  push:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Pushes as the repository's screenshots GitHub App, not with the job's own token: a push made with that token
      # starts the pull request's CI only once someone approves it, and its run fails with no jobs when nobody does.
      # The App's push starts it as anyone's does. The App needs read and write access to contents, on this repository;
      # its client ID is the variable SCREENSHOTS_APP_CLIENT_ID and its private key the secret
      # SCREENSHOTS_APP_PRIVATE_KEY.
      - name: Create the App's token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.SCREENSHOTS_APP_CLIENT_ID }}
          private-key: ${{ secrets.SCREENSHOTS_APP_PRIVATE_KEY }}
          permission-contents: write

      # Keeps the App's token in the checkout, unlike every other one: this job pushes with it, and uploads nothing.
      - name: Check out repository # zizmor: ignore[artipacked]
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app.outputs.token }}

      - name: Fetch the baselines
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots

      - name: Copy in PNGs only
        env:
          SRC: ${{ runner.temp }}/screenshots
        run: |
          stray=$(find "$SRC" -mindepth 1 -regextype posix-extended ! -type d \
            ! \( -type f -regex "$SRC/[^/]+-snapshots/[^/]+\.png" \) -print)
          if [ -n "$stray" ]; then
            printf 'Not a screenshot baseline:\n%s\n' "$stray" >&2
            exit 1
          fi
          cp -R "$SRC"/. ui/e2e/

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git add -- 'ui/e2e/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "Baselines already match CI's Chromium; nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-status | tee -a "$GITHUB_STEP_SUMMARY"
          # The App's bot account authors the commit, so the history names what pushed it.
          bot_id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit --quiet -m 'test(ui): regenerate screenshot baselines on CI' \
            -m "From ${GITHUB_SHA} by the Screenshots workflow, run ${GITHUB_RUN_ID}."
          # No force: if the branch moved since the run started, the images may be stale, so fail and run it again.
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::error::${BRANCH} moved since this run started; run the workflow again on its new head."
            exit 1
          fi
