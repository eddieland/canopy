name: Screenshots

# Regenerates the Playwright screenshot baselines on CI's runner, with the Chromium and fonts the ui-e2e check compares
# against, and pushes any that changed to the branch it was run on. On demand only: run it on a branch from the
# Actions tab, `gh workflow run screenshots.yml --ref BRANCH`, or the GitHub API, after a deliberate visual change.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Runs the branch's code with a read-only token. Same steps as ci.yml's ui-e2e, so the images match what it checks.
  generate:
    if: github.ref_type == 'branch' && github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm --prefix ui ci --no-audit --no-fund

      - name: Install Playwright's Chromium
        working-directory: ui
        run: npx playwright install --with-deps chromium

      # `changed` rewrites only the images that fail the comparison, and writes missing ones, so antialiasing noise
      # within the threshold does not churn the rest. Any other failing test fails the run and nothing is pushed.
      - name: Playwright, updating the baselines
        working-directory: ui
        run: npm run test:e2e -- --update-snapshots=changed

      - name: Keep the baselines
        uses: actions/upload-artifact@v7.0.2
        with:
          name: screenshots
          path: ui/e2e/*-snapshots/*.png
          if-no-files-found: error
          retention-days: 1

      - name: Keep the report
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: |
            ui/playwright-report
            ui/test-results
          retention-days: 7

  # Holds the write token and runs none of the branch's code: it commits the images and nothing else.
  push:
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      # To start CI on the new commit: a push made with the job's token starts no workflows, a dispatch does.
      actions: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Fetch the baselines
        uses: actions/download-artifact@v8.0.2
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots

      - name: Copy in PNGs only
        env:
          SRC: ${{ runner.temp }}/screenshots
        run: |
          stray=$(find "$SRC" -mindepth 1 -regextype posix-extended ! -type d \
            ! \( -type f -regex "$SRC/[^/]+-snapshots/[^/]+\.png" \) -print)
          if [ -n "$stray" ]; then
            printf 'Not a screenshot baseline:\n%s\n' "$stray" >&2
            exit 1
          fi
          cp -R "$SRC"/. ui/e2e/

      - name: Commit and push
        env:
          BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- 'ui/e2e/*-snapshots/*.png'
          if git diff --cached --quiet; then
            echo "Baselines already match CI's Chromium; nothing to push." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git diff --cached --name-status | tee -a "$GITHUB_STEP_SUMMARY"
          git config user.name 'github-actions[bot]'
          git config user.email '41898283+github-actions[bot]@users.noreply.github.com'
          git commit --quiet -m 'test(ui): regenerate screenshot baselines on CI' \
            -m "From ${GITHUB_SHA} by the Screenshots workflow, run ${GITHUB_RUN_ID}."
          # No force: if the branch moved since the run started, the images may be stale, so fail and run it again.
          if ! git push origin "HEAD:refs/heads/${BRANCH}"; then
            echo "::error::${BRANCH} moved since this run started; run the workflow again on its new head."
            exit 1
          fi
          gh workflow run ci.yml --ref "$BRANCH"
