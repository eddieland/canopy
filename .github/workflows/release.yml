name: Release

# Builds canopy's single executable for each platform it ships for, checks each one the way README installs it, and on
# a version tag attaches them to a GitHub Release (D067). Nothing here holds a credential but the job's own token.
on:
  push:
    tags: ["v*"]
  # The build and check, without a release, for changes to anything the executable holds or how it is built.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .agents/**
      - Makefile
      - migrations/**
      - packages/**
      - pyproject.toml
      - hatch_build.py
      - scripts/build-binary.sh
      - src/**
      - tests/install-check.sh
      - ui/**
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
            arch: aarch64
          - runner: macos-latest
            platform: macos-aarch64
            arch: arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      # The wheel's build hook builds the web UI into the executable (D079).
      - name: Set up Node
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"

      # The executable is built for the runner it runs on; a runner label that moves to another architecture must not
      # ship under this platform's name.
      - name: Check the runner's architecture
        run: |
          arch=$(uname -m)
          [ "$arch" = "${{ matrix.arch }}" ] || { echo "runner is $arch, not ${{ matrix.arch }}"; exit 1; }

      - name: Check the tag names the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }

      # pex's scie builder looks up the python-build-standalone release through the GitHub API; the job's token keeps
      # it clear of the unauthenticated rate limit shared by every job on the runner's address.
      - name: Build the executable
        env:
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
          CANOPY_UI_REQUIRED: "1"
        run: make binary

      - name: Install it as README says and run a dry tick
        run: make install-check INSTALL_SOURCE=dist/canopy

      - name: Name it for its platform
        run: |
          mkdir -p out
          cp dist/canopy "out/canopy-${{ matrix.platform }}"
          cd out && shasum -a 256 "canopy-${{ matrix.platform }}" >"canopy-${{ matrix.platform }}.sha256"

      - name: Keep it for the release job
        uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect the executables
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      # A rerun, after a partial upload or to rebuild, replaces the assets of the release the first run made.
      - name: Create the release, or update its assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" out/* \
              --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
