name: Release

# Builds canopy's single executable for each platform it ships for, checks each one the way README installs it, and on
# a version tag attaches them to a GitHub Release (D067). Nothing here holds a credential but the job's own token.
on:
  push:
    tags: ["v*"]
  # The build and check, without a release, for changes that could break them.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - Makefile
      - pyproject.toml
      - uv.lock
      - packages/*/pyproject.toml
      - scripts/build-binary.sh
      - tests/install-check.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  binary:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-aarch64
          - runner: macos-latest
            platform: macos-aarch64
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: false

      - name: Check the tag names the version in pyproject.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(uv version --short)
          [ "${GITHUB_REF_NAME#v}" = "$version" ] || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }

      # pex's scie builder looks up the python-build-standalone release through the GitHub API; the job's token keeps
      # it clear of the unauthenticated rate limit shared by every job on the runner's address.
      - name: Build the executable
        env:
          SCIENCE_AUTH_API_GITHUB_COM_BEARER: ${{ github.token }}
        run: make binary

      - name: Install it as README says and run a dry tick
        run: make install-check INSTALL_SOURCE=dist/canopy

      - name: Name it for its platform
        run: |
          mkdir -p out
          cp dist/canopy "out/canopy-${{ matrix.platform }}"
          cd out && shasum -a 256 "canopy-${{ matrix.platform }}" >"canopy-${{ matrix.platform }}.sha256"

      - name: Keep it for the release job
        uses: actions/upload-artifact@v4
        with:
          name: canopy-${{ matrix.platform }}
          path: out/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: binary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Collect the executables
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" out/*
          --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
