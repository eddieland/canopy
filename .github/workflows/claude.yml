name: Claude

# Claude Code answers a comment, review, or new issue that mentions @claude. It authenticates with the operator's Claude
# subscription: the CLAUDE_CODE_OAUTH_TOKEN repository secret, the same one Claude Review uses. The action runs only for
# a user with write access to this repository, and never for a bot. It replies in a comment and may commit what it was
# asked to change, with the Claude GitHub App's token: to the pull request's branch, or to a new claude/ branch for an
# issue. The Protect main ruleset keeps it off main, and it never approves or merges. On a pull request the action
# restores .claude/ and CLAUDE.md from the base branch, so the pull request cannot add hooks or settings to the run.
# zizmor flags issue_comment, which runs with this repository's secrets for anyone who can comment. Here the action
# refuses a commenter without write access, as said above, and the env scrub keeps the token from Claude's commands.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

permissions:
  contents: read

concurrency:
  # One run per issue or pull request at a time; a second mention waits rather than cancelling the first.
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: >-
      ${{
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude'))
        || (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
        || (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
        || (github.event_name == 'issues'
          && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # Claude reads the pull request's CI results.
      actions: read
      # The action trades the run's OIDC token for a Claude GitHub App token to comment and push with.
      id-token: write
    env:
      # Strip the OAuth token and other secrets from the environment of every command Claude runs, so text in an issue
      # or pull request cannot get it to echo one into a comment. The action turns this on only for non-write users
      # unless asked.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install the sandbox's tools
        # The env scrub above runs each of Claude's commands in its sandbox, which needs bwrap and socat; ubuntu-latest
        # has neither. Claude Review's workflow says why.
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat

      - name: Let bwrap create user namespaces
        # Ubuntu 24.04's AppArmor denies unprivileged user namespaces; this profile grants them to /usr/bin/bwrap alone.
        # Claude Review's workflow says why it is this and not the sysctl.
        run: |
          sudo apt-get install -y apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict

      - name: Run Claude
        # Pinned to a commit, not the movable v1 tag, because this step holds the subscription token.
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read
