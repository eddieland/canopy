<!doctype html>
<!-- Published as a claude.ai artifact; see README.md. Lines are not wrapped. Marks save only there. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canopy, redrawn</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap">
</head>
<body>
<style>
/* Layout: a contact sheet. A list of boards on the left, one board at a time on the right; each direction's mockup is
   drawn at the operator's 1440px and scaled into its frame, so every board shows the same screens at the same size. */
:root {
  --f-bg: #f1f2f4;
  --f-surface: #ffffff;
  --f-raised: #e8eaee;
  --f-line: #d9dce2;
  --f-fg: #15171c;
  --f-muted: #5a606c;
  --f-accent: #3549d0;
  --f-accent-fg: #ffffff;
  --f-good: #1d7a4e;
  --f-warn: #9a5d00;
  --f-bad: #b3342a;
  --f-sans: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --f-bg: #0d0e11; --f-surface: #15171b; --f-raised: #1e2127; --f-line: #2a2e36; --f-fg: #eceef2;
    --f-muted: #9aa0ab; --f-accent: #93a0ff; --f-accent-fg: #0d0e11; --f-good: #5fd39b; --f-warn: #f2b65a;
    --f-bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --f-bg: #0d0e11; --f-surface: #15171b; --f-raised: #1e2127; --f-line: #2a2e36; --f-fg: #eceef2;
  --f-muted: #9aa0ab; --f-accent: #93a0ff; --f-accent-fg: #0d0e11; --f-good: #5fd39b; --f-warn: #f2b65a;
  --f-bad: #ff8a80; color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--f-bg); color: var(--f-fg); font-family: var(--f-sans); font-size: 15px; line-height: 1.55; }
a { color: var(--f-accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--f-accent); outline-offset: 2px; }

.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100vh; }
.side {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start; height: 100vh; overflow-y: auto;
  border-right: 1px solid var(--f-line); padding: 24px 14px 24px max(14px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 4px;
}
.side .mark { padding: 0 10px 18px; display: flex; flex-direction: column; gap: 2px; }
.side .mark b { font-size: 19px; font-weight: 700; letter-spacing: -0.01em; }
.side .mark span { font-family: var(--f-mono); font-size: 11px; color: var(--f-muted); }
.side .grp { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--f-muted); padding: 16px 10px 6px; }
.side button {
  all: unset; cursor: pointer; display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline;
  padding: 7px 10px; border-radius: 8px; font-size: 14px; color: var(--f-fg);
}
.side button:hover { background: var(--f-raised); }
.side button[aria-current="true"] { background: var(--f-surface); box-shadow: 0 0 0 1px var(--f-line); font-weight: 600; }
.side button:focus-visible { outline: 2px solid var(--f-accent); }
.side .n { font-family: var(--f-mono); font-size: 11px; color: var(--f-muted); }
.side .v { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; }
.v.keep { color: var(--f-good); } .v.maybe { color: var(--f-warn); } .v.drop { color: var(--f-bad); }

main { min-width: 0; padding-block: 36px 80px; padding-left: max(32px, env(safe-area-inset-left, 0px)); padding-right: max(32px, env(safe-area-inset-right, 0px)); }
.board { max-width: 1240px; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--f-muted); }
h1 { font-size: 36px; line-height: 1.1; letter-spacing: -0.02em; margin: 6px 0 0; text-wrap: balance; font-weight: 700; }
h2 { font-size: 21px; line-height: 1.25; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h3 { font-size: 15px; margin: 0; }
.lede { font-size: 18px; max-width: 68ch; color: var(--f-fg); margin: 12px 0 0; }
p { margin: 0; max-width: 72ch; }
.muted { color: var(--f-muted); }
.prose { display: flex; flex-direction: column; gap: 12px; }
code, .code { font-family: var(--f-mono); font-size: 0.88em; background: var(--f-raised); padding: 1px 5px; border-radius: 4px; }

.panel { background: var(--f-surface); border: 1px solid var(--f-line); border-radius: 12px; padding: 22px 24px; }
.cols2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
.cols3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
ul.tight { margin: 8px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; }
ul.tight li { max-width: 70ch; }

.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 1px; background: var(--f-line); border: 1px solid var(--f-line); border-radius: 12px; overflow: hidden; }
.stat { background: var(--f-surface); padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.stat .k { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--f-muted); }
.stat .val { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 26px; line-height: 1.1; }
.stat .val s { color: var(--f-muted); text-decoration: none; font-size: 16px; }
.stat .d { font-size: 13px; color: var(--f-muted); }

.tabs { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tabs button {
  border: 1px solid var(--f-line); background: var(--f-surface); border-radius: 999px; padding: 6px 14px; cursor: pointer;
  font-size: 14px;
}
.tabs button[aria-selected="true"] { background: var(--f-fg); color: var(--f-bg); border-color: var(--f-fg); }
.tabs .sep { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--f-line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 6px 12px; background: var(--f-surface); }
.seg button[aria-pressed="true"] { background: var(--f-raised); font-weight: 600; }

.stage-wrap { position: relative; overflow: hidden; border-radius: 12px; border: 1px solid var(--f-line); background: var(--f-raised); }
.stage { width: 1440px; transform-origin: 0 0; position: absolute; top: 0; left: 0; }
.stage-cap { font-size: 13px; color: var(--f-muted); margin-top: -16px; }

.shot { border: 1px solid var(--f-line); border-radius: 12px; overflow: hidden; background: #0b0d14; }
.shot img { display: block; width: 100%; height: auto; }
.shot-grid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.notes { display: flex; flex-direction: column; gap: 14px; }
.obs { display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.obs b { font-family: var(--f-mono); font-size: 12px; color: var(--f-muted); font-weight: 500; padding-top: 2px; }

.diag { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.diag .panel { display: flex; flex-direction: column; gap: 8px; }
.diag .num { font-family: var(--f-mono); font-size: 12px; color: var(--f-muted); }

.recap { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 14px; }
.rc { background: var(--f-surface); border: 1px solid var(--f-line); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 8px; }
.rc .sw { display: flex; height: 22px; border-radius: 6px; overflow: hidden; }
.rc .sw i { flex: 1; }
.rc .tag { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; }
.rc .tag.won { color: var(--f-good); } .rc .tag.kept { color: var(--f-accent); } .rc .tag.out { color: var(--f-muted); }
.rc .face { font-size: 13px; color: var(--f-muted); }

.facts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.facts .panel { padding: 18px 20px; }
.facts h3 { font-family: var(--f-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--f-muted); font-weight: 500; margin-bottom: 8px; }
.facts ul { margin: 0; padding-left: 16px; display: flex; flex-direction: column; gap: 6px; font-size: 14px; }

.tbl-wrap { overflow-x: auto; border: 1px solid var(--f-line); border-radius: 12px; background: var(--f-surface); }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--f-line); vertical-align: top; }
th { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--f-muted); font-weight: 500; background: var(--f-raised); white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
td.k { font-weight: 600; white-space: nowrap; }
td .gone { color: var(--f-muted); text-decoration: line-through; }

.verdict { display: flex; flex-direction: column; gap: 12px; }
.verdict .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.vbtn { border: 1px solid var(--f-line); background: var(--f-surface); border-radius: 8px; padding: 8px 16px; cursor: pointer; font-weight: 600; }
.vbtn[aria-pressed="true"].keep { background: var(--f-good); color: var(--f-bg); border-color: var(--f-good); }
.vbtn[aria-pressed="true"].maybe { background: var(--f-warn); color: var(--f-bg); border-color: var(--f-warn); }
.vbtn[aria-pressed="true"].drop { background: var(--f-bad); color: var(--f-bg); border-color: var(--f-bad); }
.vbtn:disabled { opacity: 0.5; cursor: not-allowed; }
textarea.vnote { width: 100%; min-height: 84px; resize: vertical; font: inherit; font-size: 14px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--f-line); background: var(--f-bg); color: var(--f-fg); }
.vstatus { font-size: 13px; color: var(--f-muted); }
.pick-list { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.pick { border: 1px solid var(--f-line); border-radius: 10px; padding: 12px 14px; background: var(--f-surface); display: flex; flex-direction: column; gap: 4px; font-size: 14px; }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; height: auto; flex-direction: row; overflow-x: auto;
    border-right: 0; border-bottom: 1px solid var(--f-line); background: var(--f-bg); gap: 4px;
    padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--f-bg); }
  .side .mark, .side .grp { display: none; }
  .side button { display: flex; gap: 6px; white-space: nowrap; }
  .side button .n { display: none; }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px 64px; }
  h1 { font-size: 28px; }
  .cols2, .cols3, .shot-grid, .facts { grid-template-columns: minmax(0, 1fr); }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Mockups. Each direction is a class on .mock; data-mode picks its dark or light palette. ---------- */
.mock { width: 1440px; min-height: 900px; font-size: 14px; line-height: 1.5; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }
.mock * { box-sizing: border-box; }
.mock .mono { font-family: var(--mono); }
.mock .fg { color: var(--fg); }
.mock .mut { color: var(--muted); }
.mock .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.mock .s-fail { color: var(--fail); } .mock .s-wait { color: var(--wait); } .mock .s-rev { color: var(--rev); }
.mock .s-run { color: var(--run); } .mock .s-other { color: var(--muted); } .mock .s-done { color: var(--done, var(--muted)); }
.mock .chip { font-family: var(--mono); font-size: 11px; padding: 1px 7px; border-radius: 4px; white-space: nowrap; }
.mock .chip.s-fail { background: color-mix(in srgb, var(--fail) 14%, transparent); }
.mock .chip.s-wait { background: color-mix(in srgb, var(--wait) 14%, transparent); }
.mock .chip.s-rev { background: color-mix(in srgb, var(--rev) 14%, transparent); }
.mock .chip.s-run { background: color-mix(in srgb, var(--run) 14%, transparent); }
.mock .chip.s-other { background: var(--raised); }
.mock p { margin: 0; max-width: none; }
.mock ul { margin: 0; }

/* D1 · Ops inbox, kept */
.m1 { --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; font-family: var(--sans); }
.m1[data-mode="dark"] { --bg: #0b0e13; --surface: #11151c; --raised: #1a202a; --line: #232b38; --fg: #e8edf5; --text: #c9d1dd; --muted: #7d8899; --accent: #8ea2ff; --accent-fg: #0b0e13; --run: #3ddc97; --wait: #ffb547; --fail: #ff6b6b; --rev: #4fd1e0; --spend: #c4a7ff; }
.m1[data-mode="light"] { --bg: #eef0f3; --surface: #ffffff; --raised: #f3f4f7; --line: #dde0e6; --fg: #1c1d22; --text: #2a2c33; --muted: #5d6070; --accent: #3550c8; --accent-fg: #ffffff; --run: #1f8a5b; --wait: #a86400; --fail: #c0392b; --rev: #0f7c8c; --spend: #6d4fc4; }
.m1 .hdr { display: flex; justify-content: space-between; align-items: stretch; height: 46px; background: var(--surface); border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 13px; }
.m1 .brand { display: flex; align-items: center; padding: 0 20px; font-weight: 600; color: var(--fg); border-right: 1px solid var(--line); }
.m1 .tabsx { display: flex; }
.m1 .tabsx span { display: flex; align-items: center; gap: 8px; padding: 0 18px; color: var(--muted); }
.m1 .tabsx span.on { color: var(--fg); background: var(--raised); box-shadow: inset 0 -2px 0 var(--accent); }
.m1 .tabsx b { color: var(--accent); font-weight: 500; }
.m1 .live { display: flex; align-items: center; gap: 12px; padding: 0 20px; color: var(--muted); font-size: 12px; }
.m1 .main { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; flex: 1; }
.m1 .counters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.m1 .ctr { background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--c); border-radius: 6px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: baseline; }
.m1 .ctr .lab { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.m1 .ctr .sub { font-size: 12px; color: var(--muted); }
.m1 .ctr .val { font-family: var(--mono); font-size: 30px; line-height: 1; color: var(--fg); font-weight: 500; }
.m1 .split { display: grid; grid-template-columns: 420px 1fr; gap: 16px; align-items: start; }
.m1 .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.m1 .list { padding: 6px; display: flex; flex-direction: column; gap: 2px; }
.m1 .lh { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 12px 6px; }
.m1 .lh h4 { margin: 0; font-size: 14px; font-weight: 600; color: var(--fg); }
.m1 .lh span, .m1 .sublab { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.06em; }
.m1 .sublab { padding: 14px 12px 4px; }
.m1 .item { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 8px; }
.m1 .item.sel { background: var(--raised); }
.m1 .item .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.m1 .item .top > span { display: flex; gap: 8px; align-items: center; }
.m1 .item .t { font-weight: 500; color: var(--fg); }
.m1 .item .x { font-size: 13px; color: var(--muted); }
.m1 .wk { display: grid; grid-template-columns: 92px 1fr 52px; gap: 8px; align-items: center; padding: 6px 12px; font-size: 12px; }
.m1 .wk .k { display: flex; align-items: center; gap: 6px; font-family: var(--mono); color: var(--fg); }
.m1 .wk .r { font-family: var(--mono); text-align: right; color: var(--muted); }
.m1 .thread { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
.m1 .th { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
.m1 .th h2 { margin: 2px 0 0; font-size: 22px; font-weight: 600; color: var(--fg); letter-spacing: 0; }
.m1 .th .k { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.m1 .msg { display: flex; flex-direction: column; gap: 4px; max-width: 660px; }
.m1 .meta { font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
.m1 .bub { padding: 12px 14px; border-radius: 4px 12px 12px 12px; background: var(--raised); color: var(--text); }
.m1 .bub.ask { background: color-mix(in srgb, var(--wait) 13%, transparent); color: var(--fg); }
.m1 .ev { display: flex; align-items: center; gap: 10px; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.m1 .ev .dot { width: 6px; height: 6px; }
.m1 .field { border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 12px 14px; min-height: 80px; color: var(--muted); }
.m1 .acts { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.m1 .btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 16px; border-radius: 8px; border: 1px solid var(--line); color: var(--fg); font-size: 14px; }
.m1 .btn.pri { background: var(--accent); color: var(--accent-fg); border-color: transparent; font-weight: 500; }
.m1 .btn.sm { padding: 4px 10px; font-size: 12px; }
.m1 .ctx { display: flex; gap: 18px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--muted); padding-top: 14px; border-top: 1px solid var(--line); }
.m1 .ctx a { color: var(--accent); text-decoration: none; }
.m1 .two { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.m1 .facts { padding: 18px 20px; display: flex; flex-direction: column; gap: 10px; font-size: 13px; }
.m1 .facts .r { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
.m1 .facts .r > span:first-child { font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding-top: 2px; }
.m1 .facts hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; width: 100%; }
.m1 .facts h5 { margin: 0; font-family: var(--mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 500; }
.m1 .pagehead { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; }
.m1 .pagehead h1 { margin: 2px 0 0; font-size: 24px; color: var(--fg); font-weight: 600; letter-spacing: 0; }
.m1 .pagehead .k { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.m1 .tr { display: grid; grid-template-columns: 64px 14px 1fr auto auto; gap: 12px; align-items: baseline; padding: 8px 18px; border-top: 1px solid var(--line); font-size: 13px; }
.m1 .tr .t { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.m1 .tr .tool { font-family: var(--mono); font-size: 12px; color: var(--fg); }
.m1 .tr .arg { font-family: var(--mono); font-size: 12px; color: var(--muted); }
.m1 .tr .r { font-family: var(--mono); font-size: 12px; color: var(--muted); text-align: right; }
.m1 .tr.model { background: var(--raised); }
.m1 .sum { padding: 20px 24px; display: grid; grid-template-columns: 1fr 300px; gap: 28px; }
.m1 .sum ul { padding-left: 18px; margin-top: 6px; display: flex; flex-direction: column; gap: 3px; }
.m1 .sum code { font-family: var(--mono); font-size: 12px; background: var(--raised); padding: 1px 5px; border-radius: 4px; }

/* D2 · Mailroom */

.m2.today .btn, .m2.today .start, .m2.today .srch { border-radius: 8px; }
.m2.today .card2 { border-radius: 8px; }
.m2[data-mode="dark"] { --add: #4ade80; --del: #f87171; }
.m2[data-mode="light"] { --add: #15803d; --del: #b91c1c; }
.m2 .s-done { color: var(--rev); }

.m2 .fnd .fb { padding: 0 14px 12px 38px; color: var(--text); font-size: 13px; }
.m2 .dl { display: grid; grid-template-columns: 34px 16px minmax(0, 1fr); font-family: var(--mono); font-size: 12px; padding: 1px 14px; color: var(--muted); }

.m2 .dl.add i { color: var(--add); font-style: normal; }

.m2 .dl.del i { color: var(--del); font-style: normal; }
.m2 .diffs { border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 6px 0; margin-bottom: 10px; background: var(--bg); }
.m2 .seg2 { display: flex; gap: 4px; padding: 0 14px 10px; font-size: 13px; }

.m2 .empty b { font-size: 18px; color: var(--fg); font-weight: 600; }

.m2 .big { font-size: 18px; color: var(--fg); line-height: 1.45; }

/* D3 · Ledger */
.m3 { --mono: 'IBM Plex Mono', ui-monospace, monospace; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
.m3[data-mode="dark"] { --bg: #121110; --surface: #181715; --raised: #221f1b; --line: #2f2b25; --fg: #efe8d8; --text: #d6cfbf; --muted: #8f8877; --accent: #f0a83a; --accent-fg: #121110; --run: #91d071; --wait: #f0a83a; --fail: #ff7a66; --rev: #7cc4d6; }

.m3 .tx2 { display: grid; grid-template-columns: 62px 120px minmax(0, 1fr) 90px 60px; gap: 0 12px; padding: 4px 24px; }

/* D4 · Briefing */
.m4 { --serif: 'Newsreader', Georgia, serif; --sans: 'Instrument Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace; font-family: var(--sans); }
.m4[data-mode="dark"] { --bg: #121417; --surface: #191c20; --raised: #22262c; --line: #2c3139; --fg: #f1eee8; --text: #d9d5cc; --muted: #979a9f; --accent: #a9d3ae; --accent-fg: #0f1a12; --run: #7fd4a0; --wait: #f2c46d; --fail: #f08a7e; --rev: #8ec9e0; }

      <li><b>Is the problem the look or the amount?</b> If direction 1 feels right, it was the amount, and the fix is a cull rather than a redesign.</li>
      <li><b>Thread or record?</b> Directions 2 and 4 make a ticket one story. Today and direction 1 keep facts beside it.</li>
      <li><b>How often do you open Ticks, Worktrees, Chores or Memory?</b> Weekly or less, and they can leave the nav in any direction.</li>
      <li><b>Reading face?</b> Most of what you read is a worker’s prose. Direction 4 is the only one that sets it for reading.</li>
      <li><b>Still dark first?</b> Every drawing has both themes; the toggle sits above it.</li></ul></div>
    <div class="panel prose"><h2>Keep whichever way</h2><ul class="tight">
      <li>Monospace, tabular readouts for every number, id and time.</li>
      <li>Status colors held to 4.5:1 by <code>tokens.test.ts</code>, in both themes.</li>
      <li>Every write is a CLI verb, and a refusal names its guard.</li>
      <li>Untrusted text stays text.</li>
      <li>A run’s summary first, then its transcript.</li>
      <li>Review findings drawn on the diff.</li></ul></div></div>
    <div class="panel prose"><h2>Your marks so far</h2><div class="pick-list">${picks}</div></div>
    <div class="panel verdict"><h2>Overall</h2>${verdictHtml('overall')}</div>
    <p class="muted">Next step once you pick: a short record in <code>docs/ui-explorations/2026-10-19-structure/</code> like round one’s, then a plan that cuts before it restyles.</p>`;
}

// ---------- Rendering and wiring ----------
function render() {
  document.getElementById('side').innerHTML = sideHtml();
  const b = state.board;
  const html = b === 'overview' ? overview() : b === 'today' ? today() : b === 'recap' ? recap() : b === 'compare' ? compare() : b === 'r4' ? r4Board() : dirBoard(b);
  document.getElementById('board').innerHTML = html;
  fit();
}
function fit() {
  document.querySelectorAll('.stage-wrap').forEach(w => {
    const s = w.firstElementChild;
    const k = Math.min(1, w.clientWidth / 1440);
    s.style.transform = `scale(${k})`;
    w.style.height = Math.ceil(s.offsetHeight * k) + 'px';
  });
}
function go(board) {
  if (!BOARDS.some(b => b.id === board)) board = 'overview';
  if (board !== state.board) state.screen = 'inbox';
  state.board = board;
  try { history.replaceState(null, '', '#' + board); } catch (e) { /* the frame may refuse it */ }
  render();
  window.scrollTo({ top: 0 });
}

document.addEventListener('click', async e => {
  const t = e.target.closest('button');
  if (!t) return;
  if (t.dataset.board) go(t.dataset.board);
  else if (t.dataset.screen) { state.screen = t.dataset.screen; render(); }
  else if (t.dataset.mode) { state.mode = t.dataset.mode; try { localStorage.setItem('redrawn-mode', state.mode); } catch (_) {} render(); }
  else if (t.dataset.shot) { state.shot = t.dataset.shot; render(); }
  else if (t.dataset.look) { state.look = t.dataset.look; render(); }
  else if (t.dataset.verdict) {
    const id = t.dataset.for;
    const note = document.getElementById('note-' + id)?.value ?? '';
    await save(id, { verdict: t.dataset.verdict, note });
  } else if (t.dataset.save) {
    const id = t.dataset.save;
    await save(id, { verdict: verdicts[id]?.verdict ?? null, note: document.getElementById('note-' + id)?.value ?? '' });
  }
});

async function save(id, data) {
  if (!db) return;
  const status = document.getElementById('vs-' + id);
  const prev = verdicts[id];
  verdicts[id] = { ...data, updated: new Date().toISOString() };
  try {
    await db.collection('verdicts').doc(id).set(verdicts[id]);
    render();
    const s = document.getElementById('vs-' + id); if (s) s.textContent = 'Saved.';
  } catch (err) {
    verdicts[id] = prev;
    if (status) status.textContent = 'Not saved: ' + (err?.message || 'the store refused it') + '.';
  }
}

try { const m = localStorage.getItem('redrawn-mode'); if (m === 'light' || m === 'dark') state.mode = m; } catch (_) {}
state.board = (location.hash || '#r4').slice(1);
if (!BOARDS.some(b => b.id === state.board)) state.board = 'overview';
render();
new ResizeObserver(fit).observe(document.getElementById('main'));
if (document.fonts?.ready) document.fonts.ready.then(fit);
window.addEventListener('hashchange', () => go(location.hash.slice(1)));

(async () => {
  try {
    db = await window.claude?.use?.('db');
  } catch (_) { db = null; }
  if (!db) { return; }
  db.collection('verdicts').onSnapshot(snap => {
    snap.docs.forEach(d => { verdicts[d.id] = d.data() || {}; });
    // Keep a note being typed: re-render only when no note has the focus.
    if (!document.activeElement?.matches?.('textarea')) render();
    else document.getElementById('side').innerHTML = sideHtml();
  }, () => {});
  if (!document.activeElement?.matches?.('textarea')) render();
})();
</script>
</body>
